<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Neon Breaker</title>
<style>
  html,body{margin:0;height:100%;background:#06020f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100vw;height:100vh;cursor:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const GAME_ID = 'brk';
function postScore(sc) { try { if (window.parent !== window) window.parent.postMessage({ type: 'score', game: GAME_ID, score: Math.floor(sc) }, '*'); } catch (e) { } }
function goMenu() { try { if (window.parent !== window) { window.parent.postMessage({ type: 'menu' }, '*'); return; } } catch (e) { } location.href = 'index.html'; }
// =====================================================================
//  NEON BREAKER — 네온 벽돌깨기
// =====================================================================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  outBack: t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * TAU / 3) + 1,
  outBounce: t => { const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375; return n * (t -= 2.625 / d) * t + .984375; }
};
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// ---------- 글로우 ----------
const glowCache = {};
function rgb(hex) { return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)]; }
function glow(hex) {
  if (!glowCache[hex]) {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), [r, gg, b] = rgb(hex);
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, `rgba(${r},${gg},${b},1)`); gr.addColorStop(.25, `rgba(${r},${gg},${b},.55)`); gr.addColorStop(1, `rgba(${r},${gg},${b},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); glowCache[hex] = c;
  }
  return glowCache[hex];
}
function drawGlow(x, y, rad, hex, a = 1) {
  if (rad <= 0 || a <= 0) return;
  ctx.globalAlpha = Math.min(1, a); ctx.drawImage(glow(hex), x - rad, y - rad, rad * 2, rad * 2); ctx.globalAlpha = 1;
}
function hsl2hex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))))).toString(16).padStart(2, '0');
  return '#' + f(0) + f(8) + f(4);
}

// ---------- 오디오 ----------
let AC = null, master = null, noiseBuf = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .32; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(type, f1, f2, dur, vol, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, f1, f2) {
  if (!AC || muted) return;
  const t = AC.currentTime, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; fl.type = 'lowpass'; fl.frequency.setValueAtTime(f1, t); fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31, 33, 36];
let sndCount = 0;
const SFX = {
  brick(c) { if (sndCount > 6) return; sndCount++; const f = 392 * Math.pow(2, SCALE[Math.min(SCALE.length - 1, c)] / 12); tone('triangle', f, f * 1.01, .14, .14); tone('sine', f * 2, f * 2, .08, .05); },
  paddle() { tone('square', 220, 330, .07, .07); },
  wall() { tone('sine', 600, 500, .04, .05); },
  steel() { tone('square', 1500, 1300, .05, .05); },
  boom() { noise(.5, .55, 3000, 60); tone('sine', 120, 30, .4, .35); },
  power() { tone('triangle', 440, 1760, .22, .18); tone('sine', 660, 1980, .3, .1, .08); },
  lose() { tone('sawtooth', 400, 60, .7, .25); noise(.4, .4, 1500, 100); },
  launch() { tone('sawtooth', 200, 800, .15, .08); },
  laser() { tone('square', 1800, 900, .05, .03); },
  clear() { [523, 659, 784, 1046, 1318].forEach((f, i) => tone('triangle', f, f, .3, .14, i * .09)); }
};

// ---------- 입력 ----------
const keys = {};
let pointerX = null, paused = false;
addEventListener('keydown', e => {
  keys[e.code] = true; initAudio();
  if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyM') muted = !muted;
  if (state === 'play') {
    if (e.code === 'KeyP' || e.code === 'Escape') paused = !paused;
    if (e.code === 'Space' || e.code === 'ArrowUp') launch();
  } else if (e.code === 'Escape') goMenu();
  else if (e.code === 'Space' || e.code === 'Enter') { if (state === 'title' || (state === 'over' && overT > 1.5)) startGame(); }
});
addEventListener('keyup', e => keys[e.code] = false);
cv.addEventListener('pointerdown', e => {
  initAudio(); pointerX = e.clientX;
  if (state !== 'play' && inMenuBtn(e.clientX, e.clientY)) { goMenu(); return; }
  if (state === 'title') { startGame(); return; }
  if (state === 'over') { if (overT > 1.5) startGame(); return; }
  if (paused) { paused = false; return; }
  launch();
});
addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) pointerX = e.clientX; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });

// ---------- 필드 ----------
let FX = 0, FW = 0, FT = 90, COLS = 12, BW = 50, BH = 24, PAD = 14;
let vignette = null;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  FW = Math.min(W, 760); FX = (W - FW) / 2;
  COLS = FW < 480 ? 9 : 12;
  BW = (FW - PAD * 2) / COLS; BH = clamp(H * .032, 18, 26);
  vignette = null;
  if (W < 1 || H < 1) return;
  vignette = document.createElement('canvas'); vignette.width = W; vignette.height = H;
  const v = vignette.getContext('2d');
  const g = v.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.6)');
  v.fillStyle = g; v.fillRect(0, 0, W, H);
}
addEventListener('resize', resize);
const paddleY = () => H - 64;
function brickRect(b) { return { x: FX + PAD + b.c * BW + 2, y: FT + 30 + b.r * BH + 2, w: BW - 4, h: BH - 4 }; }

// ---------- 상태 ----------
let state = 'title', T = 0, overT = 0;
let bricks = [], balls = [], caps = [], lasers = [], parts = [], texts = [], timers = [];
let paddle, level = 1, lives = 3, score = 0, dispScore = 0, combo = 0, maxCombo = 0, comboPop = 0;
let shake = 0, flash = 0, flashColor = '255,255,255', hitstop = 0, slowmo = 0, timeScale = 1;
let banner = null, clearing = false, newRecord = false, bricksBroken = 0, wallFlash = { l: 0, r: 0, t: 0 };
let hiscore = 0; try { hiscore = +localStorage.getItem('neonbreaker_hi') || 0; } catch (e) { }
const after = (t, fn) => timers.push({ t, fn });
const showBanner = (text, sub, color) => banner = { text, sub, color, t: 0, dur: 2.2 };

function newPaddle() { return { x: W / 2, w: 120, tw: 120, squash: 0, wideT: 0, laserT: 0, laserCd: 0, vx: 0 }; }
function baseSpeed() { return 430 + level * 22; }
function newBall(stuck = true) {
  return { x: paddle.x, y: paddleY() - 16, vx: 0, vy: 0, r: 7, stuck, off: rand(-20, 20), spd: baseSpeed(), trail: [], fireT: 0, slowT: 0 };
}

function buildLevel(lv) {
  bricks = [];
  const rows = Math.min(10, 5 + Math.floor(lv / 2));
  const pat = (lv - 1) % 6;
  const hueBase = (lv * 47) % 360;
  for (let r = 0; r < rows; r++) for (let c = 0; c < COLS; c++) {
    const mc = c - (COLS - 1) / 2, mr = r - (rows - 1) / 2;
    let on = true;
    if (pat === 1) on = Math.abs(mc) / (COLS / 2) + Math.abs(mr) / (rows / 2) <= 1.05;
    else if (pat === 2) on = (r + c) % 2 === 0;
    else if (pat === 3) on = Math.abs(Math.sin(c * .7 + r * .2) * rows * .5 - (r - rows * .25)) < 2.2;
    else if (pat === 4) on = !(r > 0 && r < rows - 1 && c > 1 && c < COLS - 2) || (r % 2 === 0 && c % 3 !== 0);
    else if (pat === 5) on = c % 4 !== 3;
    if (!on) continue;
    let type = 'normal', hp = 1;
    const rr = Math.random();
    if (pat === 4 && (r === 0) && c % 2 === 0) type = 'steel';
    else if (lv >= 3 && rr < .05) type = 'steel';
    else if (rr < .12) type = 'bomb';
    else if (r < Math.min(rows - 1, Math.floor(lv / 2) + 1) || rr < .1 + lv * .02) { type = 'armor'; hp = lv >= 4 && Math.random() < .4 ? 3 : 2; }
    const color = type === 'bomb' ? '#ff3b3b' : type === 'steel' ? '#9aa6bd' : hsl2hex((hueBase + r * 24) % 360, 95, 60);
    bricks.push({ c, r, type, hp, maxHp: hp, color, hit: 0, wob: 0, appear: -(r * .05 + Math.abs(mc) * .03) - .2, dead: false });
  }
  // 최소한 깰 벽돌이 있도록 보장
  if (!bricks.some(b => b.type !== 'steel')) bricks.forEach(b => b.type = 'normal');
}

function reset(lv = 1) {
  paddle = newPaddle(); balls = [newBall()]; caps = []; lasers = []; parts = []; texts = []; timers = [];
  level = lv; lives = 3; score = 0; dispScore = 0; combo = 0; maxCombo = 0; bricksBroken = 0;
  clearing = false; paused = false; newRecord = false; slowmo = 0; timeScale = 1;
  buildLevel(level);
}
function startGame() {
  reset(1); state = 'play';
  showBanner('LEVEL 1', '모든 벽돌을 부숴라!', '#ff3df0'); SFX.power();
}
function gameOver() {
  state = 'over'; overT = 0;
  postScore(score);
  if (score > hiscore) { hiscore = score; newRecord = true; try { localStorage.setItem('neonbreaker_hi', hiscore); } catch (e) { } }
}
function launch() {
  if (state !== 'play' || paused) return;
  for (const b of balls) if (b.stuck) {
    b.stuck = false; const a = -Math.PI / 2 + clamp(b.off / 60, -.5, .5) + rand(-.1, .1);
    b.vx = Math.cos(a) * b.spd; b.vy = Math.sin(a) * b.spd;
    ring(b.x, b.y, 40, '#ffffff', .3, 3); SFX.launch();
  }
}

// ---------- 파티클 ----------
function P(o) { if (parts.length < 1800) parts.push(o); }
function spark(x, y, a, s, color, life, size = 2) { P({ kind: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, size, color, drag: .9 }); }
function ring(x, y, r1, color, life = .5, size = 4) { P({ kind: 'ring', x, y, r0: 2, r1, size, color, life, max: life }); }
function addText(x, y, text, color = '#fff', size = 18, dur = .9, big = false) { texts.push({ x, y, text, color, size, dur, t: 0, big }); }
function shatter(rc, color, power = 1) {
  const cx = rc.x + rc.w / 2, cy = rc.y + rc.h / 2;
  P({ kind: 'glow', x: cx, y: cy, vx: 0, vy: 0, life: .3, max: .3, size: rc.w * .9, color, grow: .6 });
  P({ kind: 'glow', x: cx, y: cy, vx: 0, vy: 0, life: .15, max: .15, size: rc.w * .5, color: '#ffffff', grow: .4 });
  ring(cx, cy, rc.w * .9 * power, color, .35, 3);
  // 파편: 벽돌을 조각으로 분할
  const nx = 4, ny = 2;
  for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
    const px = rc.x + (i + .5) * rc.w / nx, py = rc.y + (j + .5) * rc.h / ny;
    const a = Math.atan2(py - cy, px - cx) + rand(-.4, .4), s = rand(80, 260) * power;
    P({ kind: 'shard', x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, g: 900, life: rand(.6, 1.1), max: 1.1, w: rc.w / nx, h: rc.h / ny, rot: 0, vr: rand(-14, 14), color, drag: .98 });
  }
  for (let i = 0; i < 8 * power; i++) spark(cx, cy, Math.random() * TAU, rand(100, 420), Math.random() < .4 ? '#ffffff' : color, rand(.25, .5), 2);
}
function explodeAt(x, y, s, color) {
  P({ kind: 'glow', x, y, vx: 0, vy: 0, life: .35, max: .35, size: 70 * s, color: '#ffffff', grow: .6 });
  P({ kind: 'glow', x, y, vx: 0, vy: 0, life: .6, max: .6, size: 110 * s, color, grow: .8 });
  ring(x, y, 120 * s, color, .5, 8 * s); ring(x, y, 180 * s, '#ffffff', .6, 2);
  for (let i = 0; i < 26 * s; i++) spark(x, y, Math.random() * TAU, rand(150, 600), Math.random() < .5 ? '#ffd23f' : color, rand(.3, .7), 3);
  for (let i = 0; i < 6 * s; i++) { const a = Math.random() * TAU, sp = rand(20, 80); P({ kind: 'smoke', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(.6, 1), max: 1, size: rand(10, 20) * s, drag: .93 }); }
}

// ---------- 게임 로직 ----------
function hitBrick(b, dmg, fromBall) {
  if (b.dead) return false;
  const rc = brickRect(b);
  b.hit = 1; b.wob = 1;
  if (b.type === 'steel') {
    SFX.steel();
    for (let i = 0; i < 5; i++) spark(rc.x + rc.w / 2, rc.y + rc.h / 2, Math.random() * TAU, rand(100, 250), '#ffffff', .25, 1.5);
    return false;
  }
  b.hp -= dmg;
  if (b.hp > 0) {
    SFX.brick(Math.min(combo, 15));
    for (let i = 0; i < 6; i++) spark(rc.x + rc.w / 2, rc.y + rc.h / 2, Math.random() * TAU, rand(80, 220), b.color, .3, 2);
    return false;
  }
  destroyBrick(b);
  return true;
}
function destroyBrick(b) {
  b.dead = true; bricksBroken++;
  combo++; comboPop = 1; maxCombo = Math.max(maxCombo, combo);
  const rc = brickRect(b), cx = rc.x + rc.w / 2, cy = rc.y + rc.h / 2;
  const pts = Math.round((b.type === 'armor' ? 120 : b.type === 'bomb' ? 150 : 60) * (1 + combo * .15) * (1 + (level - 1) * .2) / 10) * 10;
  score += pts;
  addText(cx, cy, '+' + pts, combo > 8 ? '#ffd23f' : '#ffffff', combo > 8 ? 20 : 15, .8);
  shatter(rc, b.color, b.type === 'armor' ? 1.3 : 1);
  SFX.brick(Math.min(combo, 15));
  shake = Math.max(shake, 3);
  if (b.type === 'bomb') {
    explodeAt(cx, cy, 1, '#ff5b2b'); SFX.boom();
    shake = Math.max(shake, 14); hitstop = Math.max(hitstop, .05); flash = Math.max(flash, .25); flashColor = '255,120,60';
    for (const o of bricks) {
      if (o.dead || o === b) continue;
      if (Math.abs(o.c - b.c) <= 1 && Math.abs(o.r - b.r) <= 1) after(.07, () => { if (!o.dead) { if (o.type === 'steel') { o.type = 'normal'; o.color = '#c7d0e0'; } hitBrick(o, 99); } });
    }
  }
  if (Math.random() < .15 && state === 'play') dropCap(cx, cy);
  const ms = { 10: 'NICE!', 20: 'GREAT!', 35: 'AMAZING!', 50: 'UNSTOPPABLE!!' }[combo];
  if (ms && state === 'play') { addText(W / 2, H * .55, ms, '#ff3df0', 54, 1.2, true); SFX.power(); }
  checkClear();
}
const CAPS = {
  M: { color: '#ff3df0', name: 'MULTI BALL' }, W: { color: '#2bd9ff', name: 'WIDE PADDLE' }, L: { color: '#ff3b3b', name: 'LASER' },
  S: { color: '#3bff9d', name: 'SLOW' }, F: { color: '#ff9b2b', name: 'FIREBALL' }, '+': { color: '#ffd23f', name: '1 UP' }
};
function dropCap(x, y) {
  const r = Math.random();
  const type = r < .25 ? 'M' : r < .45 ? 'W' : r < .62 ? 'L' : r < .78 ? 'S' : r < .94 ? 'F' : '+';
  caps.push({ x, y, type, t: 0, vy: 140 });
}
function collectCap(c) {
  const info = CAPS[c.type];
  ring(c.x, c.y, 90, info.color, .45, 5);
  for (let i = 0; i < 16; i++) spark(c.x, c.y, i / 16 * TAU, rand(150, 320), info.color, .4, 2);
  addText(c.x, c.y - 30, info.name + '!', info.color, 22, 1);
  SFX.power(); score += 100;
  if (c.type === 'M') {
    const add = [];
    for (const b of balls) { if (balls.length + add.length >= 12) break;
      for (const da of [-.45, .45]) { const nb = { ...b, trail: [], stuck: false }; const a = Math.atan2(b.stuck ? -1 : b.vy, b.stuck ? 0 : b.vx) + da; nb.vx = Math.cos(a) * b.spd; nb.vy = Math.sin(a) * b.spd; add.push(nb); } }
    balls.push(...add);
  } else if (c.type === 'W') { paddle.wideT = 14; }
  else if (c.type === 'L') { paddle.laserT = 10; }
  else if (c.type === 'S') { for (const b of balls) b.slowT = 9; }
  else if (c.type === 'F') { for (const b of balls) b.fireT = 8; }
  else { lives = Math.min(6, lives + 1); }
}
function checkClear() {
  if (clearing || state !== 'play') return;
  if (bricks.some(b => !b.dead && b.type !== 'steel')) return;
  clearing = true;
  const bonus = 2000 * level + lives * 500;
  score += bonus;
  slowmo = 1; flash = .6; flashColor = '255,255,255';
  showBanner('LEVEL CLEAR!', '보너스 +' + bonus.toLocaleString(), '#ffd23f'); SFX.clear();
  for (const b of bricks) if (!b.dead) { b.dead = true; shatter(brickRect(b), b.color, .8); }
  for (const b of balls) { for (let i = 0; i < 10; i++) spark(b.x, b.y, Math.random() * TAU, rand(100, 300), '#ffffff', .4); }
  after(2.6, () => {
    level++; buildLevel(level); balls = [newBall()]; caps = []; lasers = []; combo = 0; clearing = false;
    paddle.wideT = 0; paddle.laserT = 0;
    showBanner('LEVEL ' + level, ['속도가 올라간다!', '단단한 벽돌 주의!', '폭탄 벽돌로 연쇄 폭발을!'][level % 3], hsl2hex((level * 47) % 360, 95, 62));
  });
}
function loseBall() {
  lives--; combo = 0;
  shake = 22; flash = .6; flashColor = '255,40,80'; hitstop = .1;
  SFX.lose();
  for (let i = 0; i < 30; i++) spark(paddle.x, paddleY(), -Math.PI / 2 + rand(-1.4, 1.4), rand(200, 600), '#ff3b6b', .6, 3);
  ring(paddle.x, paddleY(), 200, '#ff3b6b', .6, 6);
  paddle.wideT = 0; paddle.laserT = 0; caps = [];
  if (lives <= 0) { slowmo = 1.5; explodeAt(paddle.x, paddleY(), 1.5, '#ff3df0'); paddle.dead = true; after(1.8, gameOver); return; }
  addText(W / 2, H * .55, 'MISS!', '#ff3b6b', 54, 1.1, true);
  after(.6, () => { balls = [newBall()]; });
}

function updateGame(dt) {
  for (let i = timers.length - 1; i >= 0; i--) { timers[i].t -= dt; if (timers[i].t <= 0) { const f = timers[i].fn; timers.splice(i, 1); f(); } }
  const ai = state === 'title';
  if (ai && !bricks.some(b => !b.dead && b.type !== 'steel')) { level = level % 6 + 1; buildLevel(level); }
  // 벽돌 등장 애니메이션
  for (const b of bricks) { b.appear += dt; b.hit = Math.max(0, b.hit - dt * 6); b.wob = Math.max(0, b.wob - dt * 3); }
  // 패들
  const py = paddleY();
  paddle.wideT -= dt; paddle.laserT -= dt;
  paddle.tw = paddle.wideT > 0 ? 180 : 120;

function shade(hex, k) { const [r, g, b] = rgb(hex), to = k < 0 ? 0 : 255, a = Math.min(1, Math.abs(k)); return `rgb(${Math.round(r + (to - r) * a)},${Math.round(g + (to - g) * a)},${Math.round(b + (to - b) * a)})`; }
