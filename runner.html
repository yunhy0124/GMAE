<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Office Dash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  html,body{margin:0;height:100%;background:#bdf1ff;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// =====================================================================
//  OFFICE DASH — 귀여운 출근길 러너 (카툰 스타일)
// =====================================================================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, GY = 0;
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  outBack: t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * TAU / 3) + 1,
  outBounce: t => { const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375; return n * (t -= 2.625 / d) * t + .984375; }
};
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const GAME_ID = 'run';
// 바깥쪽 모든 화면(런처)에 메시지 전달. 게시된 페이지는 한 겹 더 감싸일 수 있음
function postUp(msg) { let sent = false; try { let w = window; for (let i = 0; i < 5 && w.parent && w.parent !== w; i++) { w = w.parent; try { w.postMessage(msg, '*'); sent = true; } catch (e) { } } } catch (e) { } return sent; }
function postScore(sc) { postUp({ type: 'score', game: GAME_ID, score: Math.floor(sc) }); }
function goMenu() { if (!postUp({ type: 'menu' })) location.href = 'index.html'; }

// ---------- 카툰 색 & 헬퍼 ----------
const OUT = '#1d3236';
const C = { mint: '#19c9a3', mintD: '#0e9a7c', mintL: '#9ff0dc', navy: '#2a3e66', navyD: '#1c2b4a', skin: '#ffe0c8', hair: '#2b2a3a', shirt: '#ffffff', brief: '#9a6236', gold: '#ffc83d', cash: '#8fe3a8', cashD: '#3daa6a' };
const FONT = '"Jua","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
function ol(fill, lw = 2.5) { if (fill) { ctx.fillStyle = fill; ctx.fill(); } ctx.lineWidth = lw; ctx.strokeStyle = OUT; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
function cartoonText(text, x, y, size, fill = '#ffffff', stroke = OUT, lw = 0) {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = lw || Math.max(3, size * .16); ctx.strokeStyle = stroke; ctx.strokeText(text, x, y + size * .04);
  ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y);
}

// ---------- 오디오 ----------
let AC = null, master = null, noiseBuf = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .32; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(type, f1, f2, dur, vol, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, f1, f2) {
  if (!AC || muted) return;
  const t = AC.currentTime, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; fl.type = 'lowpass'; fl.frequency.setValueAtTime(f1, t); fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
const SFX = {
  jump() { tone('square', 320, 760, .12, .06); },
  djump() { tone('square', 520, 1200, .14, .06); tone('sine', 900, 1800, .15, .05); },
  land() { noise(.07, .12, 800, 200); },
  slide() { noise(.25, .1, 3000, 500); },
  cash(n) { const f = 988 * Math.pow(2, Math.min(n, 12) / 12); noise(.05, .08, 6000, 2000); tone('square', f, f, .06, .045); tone('square', f * 1.335, f * 1.335, .12, .045, .06); },
  stomp() { tone('square', 260, 90, .1, .1); tone('square', 400, 900, .12, .06, .06); },
  power() { [523, 659, 784, 1046].forEach((f, i) => tone('triangle', f, f, .12, .1, i * .06)); },
  death() { [523, 392, 330, 262, 196].forEach((f, i) => tone('triangle', f, f * .98, .16, .12, i * .1)); },
  shield() { tone('sine', 1200, 300, .3, .2); noise(.2, .3, 4000, 500); },
  speed() { [392, 523, 659, 784].forEach((f, i) => tone('square', f, f * 1.02, .14, .07, i * .07)); }
};

// ---------- 입력 ----------
const keys = {};
let paused = false, jumpHeld = false, slideHeld = false, touchSlideId = null;
addEventListener('keydown', e => {
  initAudio();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  const first = !keys[e.code]; keys[e.code] = true;
  if (e.code === 'KeyM') muted = !muted;
  if (state === 'play') {
    if (e.code === 'KeyP' || e.code === 'Escape') paused = !paused;
    if (first && (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW')) { jumpHeld = true; jump(); }
    if (first && (e.code === 'ArrowDown' || e.code === 'KeyS')) { slideHeld = true; slideStart(); }
  } else if (e.code === 'Escape') goMenu();
  else if (state === 'title' && (e.code === 'ArrowLeft' || e.code === 'KeyA')) setChar(-1);
  else if (state === 'title' && (e.code === 'ArrowRight' || e.code === 'KeyD')) setChar(1);
  else if (e.code === 'Space' || e.code === 'Enter') { if (state === 'title' || (state === 'over' && overT > 1.5)) startGame(); }
});
addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') jumpHeld = keys.Space || keys.ArrowUp || keys.KeyW;
  if (e.code === 'ArrowDown' || e.code === 'KeyS') slideHeld = keys.ArrowDown || keys.KeyS;
});
cv.addEventListener('pointerdown', e => {
  initAudio();
  if (state !== 'play' && inMenuBtn(e.clientX, e.clientY)) { goMenu(); return; }
  if (state === 'title') { for (const ar of selArrows()) if (Math.hypot(e.clientX - ar.x, e.clientY - ar.y) < 30) { setChar(ar.dir); return; } startGame(); return; }
  if (state === 'over') { if (overT > 1.5) startGame(); return; }
  if (paused) { paused = false; return; }
  if (e.clientX < W * .4) { touchSlideId = e.pointerId; slideHeld = true; slideStart(); }
  else { jumpHeld = true; jump(); }
});
const release = e => { if (e.pointerId === touchSlideId) { slideHeld = false; touchSlideId = null; } else jumpHeld = false; };
addEventListener('pointerup', release); addEventListener('pointercancel', release);
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });

// ---------- 화면 ----------
let layers = [], clouds = [], bushes = [];
const PASTEL = ['#fff1c9', '#ffd9cf', '#d8f1ff', '#d4f7e6', '#ffe4f0', '#e8e2ff', '#fff6e0'];
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight; GY = Math.round(H * .78);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (W < 1 || H < 1) return;
  layers = [makeLayer(.06, true), makeLayer(.2, false, 0), makeLayer(.4, false, 1)];
  clouds = []; for (let i = 0; i < 7; i++) clouds.push({ x: Math.random() * W, y: rand(.06, .42) * GY, s: rand(.6, 1.3), sp: rand(6, 16) });
  bushes = []; let x = 0; while (x < W + 300) { bushes.push({ x, s: rand(.7, 1.3), k: Math.random() < .35 ? 'tree' : 'bush' }); x += rand(90, 220); }
  if (pl) { pl.x = W * .22; if (pl.ground) pl.y = GY; }
}
function newBuilding(L) {
  const far = L.depth;
  const w = L.mountain ? rand(160, 300) : rand([60, 70][far], [110, 120][far]);
  const hMax = L.mountain ? .3 : [.5, .36][far];
  return { w, h: rand(.4, 1) * hMax * GY, seed: Math.random() * 1000, col: PASTEL[Math.random() * PASTEL.length | 0], roof: Math.random() < .3 ? 'tri' : Math.random() < .5 ? 'flat' : 'step', sign: !L.mountain && Math.random() < .3 };
}
function makeLayer(par, mountain, depth = 0) {
  const L = { par, items: [], mountain, depth };
  let x = -60;
  while (x < W + 300) { const b = newBuilding(L); b.x = x; L.items.push(b); x += b.w + (mountain ? -b.w * .35 : rand(6, 22)); }
  return L;
}
addEventListener('resize', resize);

// ---------- 상태 ----------
let state = 'title', T = 0, overT = 0;
let pl = null, obs = [], gaps = [], plats = [], coins = [], items = [], parts = [], texts = [], timers = [], ghosts = [];
let spd = 430, dist = 0, score = 0, dispScore = 0, coinCount = 0, stomps = 0, nextX = 0, milestone = 500;
let shake = 0, flash = 0, flashColor = '255,255,255', hitstop = 0, slowmo = 0, timeScale = 1, warp = 0;
let banner = null, newRecord = false, coinChain = 0, coinChainT = 0, snacks = 0;
let hiscore = 0; try { hiscore = +localStorage.getItem('neondash_hi') || 0; } catch (e) { }
const after = (t, fn) => timers.push({ t, fn });
const showBanner = (text, sub, color) => banner = { text, sub, color, t: 0, dur: 2 };
const meters = () => Math.floor(dist / 50);

function newPlayer() { return { x: W * .22, y: GY, vy: 0, ground: true, jumps: 0, slideT: 0, sliding: false, phase: 0, spin: 0, squash: 0, shield: false, magnetT: 0, x2T: 0, coffeeT: 0, dead: false, ghostT: 0 }; }
function reset() {
  pl = newPlayer();
  obs = []; gaps = []; plats = []; coins = []; items = []; parts = []; texts = []; timers = []; ghosts = [];
  spd = 430; dist = 0; score = 0; dispScore = 0; coinCount = 0; stomps = 0; nextX = W + 300; milestone = 500;
  paused = false; newRecord = false; slowmo = 0; timeScale = 1; coinChain = 0; snacks = 0;
}
function startGame() {
  reset(); state = 'play'; warp = 2;
  showBanner('출근 시작!', '지각하지 않게 최대한 멀리 달려요!', C.mint); SFX.speed();
}
function gameOver() {
  state = 'over'; overT = 0;
  postScore(score);
  if (score > hiscore) { hiscore = score; newRecord = true; try { localStorage.setItem('neondash_hi', hiscore); } catch (e) { } }
}

// ---------- 파티클 ----------
function P(o) { if (parts.length < 1200) parts.push(o); }
function spark(x, y, a, s, color, life, size = 3) { P({ kind: 'star', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, size, color, drag: .9, rot: Math.random() * TAU, vr: rand(-8, 8) }); }
function ring(x, y, r1, color, life = .5, size = 4) { P({ kind: 'ring', x, y, r0: 2, r1, size, color, life, max: life }); }
function addText(x, y, text, color = '#fff', size = 18, dur = .9, big = false) { texts.push({ x, y, text, color, size, dur, t: 0, big }); }
function dust(x, y, n, power = 1) {
  for (let i = 0; i < n; i++) P({ kind: 'dust', x: x + rand(-10, 10), y: y - 2, vx: rand(-160, 40) * power - spd * .15, vy: rand(-70, -10) * power, life: rand(.3, .55), max: .55, size: rand(4, 8), drag: .9 });
}
function poof(x, y, s, col) {
  for (let i = 0; i < 10 * s; i++) { const a = Math.random() * TAU, sp = rand(80, 260) * s; P({ kind: 'dust', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(.4, .8), max: .8, size: rand(6, 12) * s, drag: .9 }); }
  for (let i = 0; i < 14 * s; i++) spark(x, y, Math.random() * TAU, rand(150, 420), Math.random() < .5 ? C.gold : col, rand(.4, .8), rand(3, 6));
  for (let i = 0; i < 6; i++) P({ kind: 'bill', x, y, vx: rand(-220, 220), vy: rand(-420, -160), g: 600, life: rand(.9, 1.4), max: 1.4, rot: rand(0, TAU), vr: rand(-6, 6), drag: .97 });
  ring(x, y, 90 * s, '#ffffff', .45, 6);
}

// ---------- 동작 ----------
function jump() {
  if (state !== 'play' || paused || pl.dead) return;
  if (pl.ground || pl.coyote > 0) {
    pl.vy = -880; pl.ground = false; pl.jumps = 1; pl.coyote = 0; pl.sliding = false; pl.slideT = 0; pl.squash = -1;
    dust(pl.x, pl.y, 6); SFX.jump();
  } else if (pl.jumps < 2) {
    pl.vy = -800; pl.jumps = 2; pl.spin = 1; pl.squash = -1;
    ring(pl.x, pl.y - 30, 46, '#ffffff', .35, 5);
    for (let i = 0; i < 8; i++) spark(pl.x, pl.y, Math.PI / 2 + rand(-1, 1), rand(120, 260), C.gold, .4, 4);
    SFX.djump();
  }
}
function slideStart() {
  if (state !== 'play' || paused || pl.dead) return;
  if (pl.ground) { if (!pl.sliding) { pl.sliding = true; pl.slideT = .45; SFX.slide(); dust(pl.x, pl.y, 8, 1.3); } }
  else { pl.vy = Math.max(pl.vy, 1300); pl.fastFall = true; }
}
function overGap(x) { for (const g of gaps) if (x > g.x + 6 && x < g.x + g.w - 6) return true; return false; }

function snackKind() { const r = Math.random(); return r < .09 ? 'coffee' : r < .18 ? 'cookie' : 'cash'; }
function spawnPattern() {
  const x0 = nextX, m = meters();
  const r = Math.random();
  let w = 0;
  const coinArc = (cx, cy, n, span, height) => { for (let i = 0; i < n; i++) { const t = n === 1 ? .5 : i / (n - 1); coins.push({ x: cx - span / 2 + span * t, y: cy - Math.sin(t * Math.PI) * height, t: Math.random() * TAU, kind: snackKind() }); } };
  const coinLine = (x, y, n) => { for (let i = 0; i < n; i++) coins.push({ x: x + i * 34, y, t: i * .7, kind: snackKind() }); };
  if (r < .26) {
    const n = 1 + (Math.random() * Math.min(3, 1 + m / 400) | 0);
    w = n * 34;
    obs.push({ type: 'spike', x: x0, w, h: 34 });
    coinArc(x0 + w / 2, GY - 90, 5, w + 120, 70);
  } else if (r < .42) {
    w = 40;
    obs.push({ type: 'gate', x: x0, w, t: 0 });
    coinLine(x0 - 60, GY - 16, 5);
  } else if (r < .6) {
    w = clamp(spd * .26 + rand(-20, 40), 110, 280);
    gaps.push({ x: x0, w });
    coinArc(x0 + w / 2, GY - 110, 6, w + 40, 80);
  } else if (r < .76) {
    const y = GY - rand(56, 70);
    obs.push({ type: 'drone', x: x0 + 20, y, by: y, w: 40, t: Math.random() * TAU, dead: false });
    coinLine(x0 - 30, GY - 150, 4);
    w = 60;
  } else {
    const pw = Math.round(rand(220, 380) / 32) * 32, py = GY - rand(100, 140);
    plats.push({ x: x0, y: py, w: pw });
    coinLine(x0 + 20, py - 26, Math.floor((pw - 40) / 34));
    if (m > 150 && Math.random() < .6) { const sw = 68; obs.push({ type: 'spike', x: x0 + pw / 2 - sw / 2, w: sw, h: 34 }); }
    w = pw;
  }
  if (Math.random() < .12) items.push({ x: x0 + w / 2, y: GY - 190, type: ['magnet', 'shield', 'x2'][Math.random() * 3 | 0], t: 0 });
  nextX += w + spd * .55 + rand(120, 360);
}

function die() {
  if (pl.dead) return;
  if (pl.shield) {
    pl.shield = false; pl.invT = 1.2; shake = 12; hitstop = .06;
    ring(pl.x, pl.y - 30, 110, '#7fe8ff', .5, 6);
    for (let i = 0; i < 16; i++) spark(pl.x, pl.y - 30, i / 16 * TAU, rand(200, 380), '#7fe8ff', .5, 4);
    addText(pl.x, pl.y - 90, '쉴드 파괴!', '#7fe8ff', 22); SFX.shield();
    return;
  }
  pl.dead = true; pl.deadT = 0; pl.deadVy = -700;
  poof(pl.x, pl.y - 30, 1.2, C.mint);
  shake = 18; flash = .5; flashColor = '255,255,255'; hitstop = .12; slowmo = 1;
  SFX.death();
  after(1.8, gameOver);
}

function updateWorld(dt) {
  for (let i = timers.length - 1; i >= 0; i--) { timers[i].t -= dt; if (timers[i].t <= 0) { const f = timers[i].fn; timers.splice(i, 1); f(); } }
  const playing = state === 'play' && !pl.dead;
  const curSpd = state === 'title' ? 420 : pl.dead ? spd * .1 : spd;
  const dx = curSpd * dt;
  for (const L of layers) {
    for (const it of L.items) it.x -= dx * L.par;
    const first = L.items[0];
    if (first && first.x + first.w < -30) {
      L.items.shift();
      const lastIt = L.items[L.items.length - 1], nb = newBuilding(L);
      nb.x = lastIt.x + lastIt.w + (L.mountain ? -nb.w * .35 : rand(6, 22));
      L.items.push(nb);
    }
  }
  for (const c of clouds) { c.x -= (c.sp + curSpd * .03) * dt; if (c.x < -160) { c.x = W + rand(40, 200); c.y = rand(.06, .42) * GY; c.s = rand(.6, 1.3); } }
  for (const b of bushes) b.x -= dx * .75;
  if (bushes.length && bushes[0].x < -120) { const f = bushes.shift(); f.x = bushes[bushes.length - 1].x + rand(90, 220); f.s = rand(.7, 1.3); f.k = Math.random() < .35 ? 'tree' : 'bush'; bushes.push(f); }
  if (state === 'title') {
    pl.phase += dt * curSpd * .032;
    for (const c of [obs, gaps, plats, coins, items]) c.length = 0;
    if (Math.random() < dt * 14) dust(pl.x - 8, GY, 1, .5);
    return;
  }
  if (playing) {
    dist += dx;
    spd = Math.min(1150, 430 + meters() * .45);
    if (meters() >= milestone) {
      showBanner('SPEED UP!', milestone + 'm 돌파! 조금만 더!', C.gold); SFX.speed();
      warp = 2.5; score += milestone;
      milestone += 500;
    }
  }
  nextX -= dx;
  if (playing) while (nextX < W + 200) spawnPattern();
  for (const arr of [obs, gaps, plats, coins, items]) for (const o of arr) o.x -= dx;
  obs = obs.filter(o => o.x + o.w > -100 && !o.gone); gaps = gaps.filter(g => g.x + g.w > -50); plats = plats.filter(p => p.x + p.w > -50);
  coins = coins.filter(c => c.x > -50 && !c.got); items = items.filter(i => i.x > -50 && !i.got);
  for (const o of obs) {
    if (o.type === 'drone') { o.t += dt; if (!o.dead) o.y = o.by + Math.sin(o.t * 4) * 10; else { o.vy += 1600 * dt; o.y += o.vy * dt; o.rot += dt * 8; if (o.y > H + 50) o.gone = true; } }
    if (o.type === 'gate') o.t += dt;
  }
  if (pl.dead) { pl.deadT += dt; pl.deadVy += 2200 * dt; pl.y += pl.deadVy * dt; }
  else updatePlayer(dt);
  for (const g of ghosts) { g.t += dt; g.x -= dx * .6; }
  ghosts = ghosts.filter(g => g.t < .25);
  coinChainT -= dt; if (coinChainT <= 0) coinChain = 0;
  score = Math.max(score, 0);
  dispScore = score - dispScore < 1 ? score : lerp(dispScore, score, 1 - Math.pow(.002, dt));
}
function updatePlayer(dt) {
  const p = pl, prevY = p.y;
  p.invT = (p.invT || 0) - dt;
  p.magnetT -= dt; p.x2T -= dt; p.coffeeT -= dt;
  if (p.coffeeT > 0 && Math.random() < dt * 20) P({ kind: 'dust', x: p.x - 10, y: p.y - rand(10, 50), vx: -spd * .3, vy: rand(-20, 20), life: .4, max: .4, size: rand(3, 6), drag: .95 });
  const g = p.vy < 0 && jumpHeld ? 2000 : 3000;
  if (!p.ground) { p.vy += g * dt; p.y += p.vy * dt; p.coyote = (p.coyote || 0) - dt; }
  let support = null;
  if (p.vy >= 0) {
    for (const pf of plats) if (p.x + 10 > pf.x && p.x - 10 < pf.x + pf.w && prevY <= pf.y + 2 && p.y >= pf.y) { support = pf.y; break; }
    if (support === null && !overGap(p.x) && prevY <= GY + 2 && p.y >= GY) support = GY;
  }
  if (p.ground) {

}
function inMenuBtn(x, y) { return Math.abs(x - W / 2) < 56 && y > 8 && y < 46; }

function shadeHex(hex) { const n = parseInt(hex.slice(1), 16); const r = (n >> 16) * .78 | 0, g2 = (n >> 8 & 255) * .78 | 0, b = (n & 255) * .78 | 0; return `rgb(${r},${g2},${b})`; }

const CHARS = [
  { name: '남자 직원', g: 'm', hairCol: '#3b2a24', suit: '#2f4a7a', suitD: '#22375c', bottom: 'pants', neck: 'tie' },
  { name: '여자 직원', g: 'f', hairCol: '#6b3f2a', suit: '#2f4a7a', suitD: '#22375c', bottom: 'skirt', neck: 'ribbon' },
];

function drawCoffee(x, y, sc = 1, t = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); ctx.rotate(Math.sin(t * 3) * .08);
