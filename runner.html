<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Neon Dash</title>
<style>
  html,body{margin:0;height:100%;background:#0a0418;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// =====================================================================
//  NEON DASH — 네온 엔드리스 러너 (HQ)
// =====================================================================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, GY = 0;
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  outBack: t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * TAU / 3) + 1,
  outBounce: t => { const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375; return n * (t -= 2.625 / d) * t + .984375; }
};
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const GAME_ID = 'run';
function postScore(sc) { try { if (window.parent !== window) window.parent.postMessage({ type: 'score', game: GAME_ID, score: Math.floor(sc) }, '*'); } catch (e) { } }
function goMenu() { try { if (window.parent !== window) { window.parent.postMessage({ type: 'menu' }, '*'); return; } } catch (e) { } location.href = 'index.html'; }

// ---------- 글로우 ----------
const glowCache = {};
function rgb(hex) { return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)]; }
function shade(hex, t) { const [r, g, b] = rgb(hex), to = t < 0 ? 0 : 255, k = Math.abs(t); return `rgb(${Math.round(r + (to - r) * k)},${Math.round(g + (to - g) * k)},${Math.round(b + (to - b) * k)})`; }
function glow(hex) {
  if (!glowCache[hex]) {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), [r, gg, b] = rgb(hex);
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, `rgba(${r},${gg},${b},1)`); gr.addColorStop(.25, `rgba(${r},${gg},${b},.55)`); gr.addColorStop(1, `rgba(${r},${gg},${b},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); glowCache[hex] = c;
  }
  return glowCache[hex];
}
function drawGlow(x, y, rad, hex, a = 1) {
  if (rad <= 0 || a <= 0) return;
  ctx.globalAlpha = Math.min(1, a); ctx.drawImage(glow(hex), x - rad, y - rad, rad * 2, rad * 2); ctx.globalAlpha = 1;
}

// ---------- 오디오 ----------
let AC = null, master = null, noiseBuf = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .32; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(type, f1, f2, dur, vol, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, f1, f2) {
  if (!AC || muted) return;
  const t = AC.currentTime, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; fl.type = 'lowpass'; fl.frequency.setValueAtTime(f1, t); fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
const SFX = {
  jump() { tone('square', 300, 700, .12, .07); },
  djump() { tone('square', 500, 1100, .14, .07); tone('sine', 900, 1800, .15, .05); },
  land() { noise(.08, .15, 800, 200); },
  slide() { noise(.25, .12, 3000, 500); },
  coin(n) { const f = 880 * Math.pow(2, Math.min(n, 12) / 12); tone('triangle', f, f, .09, .1); tone('sine', f * 2, f * 2, .06, .04, .04); },
  stomp() { tone('square', 200, 900, .12, .12); noise(.15, .25, 2000, 300); },
  power() { tone('triangle', 440, 1760, .22, .18); tone('sine', 660, 1980, .3, .1, .08); },
  death() { noise(.8, .7, 3000, 50); tone('sawtooth', 500, 40, .9, .3); },
  shield() { tone('sine', 1200, 300, .3, .2); noise(.2, .3, 4000, 500); },
  speed() { [392, 523, 659, 784].forEach((f, i) => tone('square', f, f * 1.02, .14, .08, i * .07)); }
};

// ---------- 입력 ----------
const keys = {};
let paused = false, jumpHeld = false, slideHeld = false, touchSlideId = null;
addEventListener('keydown', e => {
  initAudio();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  const first = !keys[e.code]; keys[e.code] = true;
  if (e.code === 'KeyM') muted = !muted;
  if (state === 'play') {
    if (e.code === 'KeyP' || e.code === 'Escape') paused = !paused;
    if (first && (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW')) { jumpHeld = true; jump(); }
    if (first && (e.code === 'ArrowDown' || e.code === 'KeyS')) { slideHeld = true; slideStart(); }
  } else if (e.code === 'Escape') goMenu();
  else if (e.code === 'Space' || e.code === 'Enter') { if (state === 'title' || (state === 'over' && overT > 1.5)) startGame(); }
});
addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') jumpHeld = keys.Space || keys.ArrowUp || keys.KeyW;
  if (e.code === 'ArrowDown' || e.code === 'KeyS') slideHeld = keys.ArrowDown || keys.KeyS;
});
cv.addEventListener('pointerdown', e => {
  initAudio();
  if (state !== 'play' && inMenuBtn(e.clientX, e.clientY)) { goMenu(); return; }
  if (state === 'title') { startGame(); return; }
  if (state === 'over') { if (overT > 1.5) startGame(); return; }
  if (paused) { paused = false; return; }
  if (e.clientX < W * .4) { touchSlideId = e.pointerId; slideHeld = true; slideStart(); }
  else { jumpHeld = true; jump(); }
});
const release = e => { if (e.pointerId === touchSlideId) { slideHeld = false; touchSlideId = null; } else jumpHeld = false; };
addEventListener('pointerup', release); addEventListener('pointercancel', release);
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });

// ---------- 화면 ----------
let vignette = null, stars = [], layers = [];
const sunCv = document.createElement('canvas');
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight; GY = Math.round(H * .76);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  vignette = null;
  if (W < 1 || H < 1) return;
  vignette = document.createElement('canvas'); vignette.width = W; vignette.height = H;
  const v = vignette.getContext('2d');
  const g = v.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)');
  v.fillStyle = g; v.fillRect(0, 0, W, H);
  stars = []; for (let i = 0; i < 110; i++) stars.push({ x: Math.random() * W, y: Math.random() * GY * .75, z: Math.random(), tw: Math.random() * TAU });
  layers = [makeLayer(.06, true), makeLayer(.18, false, 0), makeLayer(.34, false, 1), makeLayer(.55, false, 2)];
}
const SIGN_COLS = ['#ff3df0', '#2bd9ff', '#ffd23f', '#3bff9d', '#ff5b6b'];
function newBuilding(L) {
  const far = L.depth;
  const w = L.mountain ? rand(90, 200) : rand([46, 40, 54][far], [100, 80, 96][far]);
  const hMax = L.mountain ? .32 : [.62, .46, .3][far];
  const b = { w, h: rand(.35, 1) * hMax * GY, seed: Math.random() * 1000, ant: Math.random() < .3, roof: Math.random() < .5 ? 'flat' : Math.random() < .5 ? 'step' : 'spire' };
  if (!L.mountain && far >= 1 && Math.random() < .55) b.sign = { c: SIGN_COLS[Math.random() * 5 | 0], w: rand(.4, .75), y: rand(.12, .45), v: Math.random() < .5, fl: Math.random() < .25 };
  return b;
}
function makeLayer(par, mountain, depth = 0) {
  const L = { par, items: [], mountain, depth };
  let x = -60;
  while (x < W + 300) { const b = newBuilding(L); b.x = x; L.items.push(b); x += b.w + (mountain ? -b.w * .35 : rand(4, 18)); }
  return L;
}
addEventListener('resize', resize);

// ---------- 상태 ----------
let state = 'title', T = 0, overT = 0;
let pl, obs = [], gaps = [], plats = [], coins = [], items = [], parts = [], texts = [], timers = [], ghosts = [];
let spd = 430, dist = 0, score = 0, dispScore = 0, coinCount = 0, stomps = 0, nextX = 0, milestone = 500;
let shake = 0, flash = 0, flashColor = '255,255,255', hitstop = 0, slowmo = 0, timeScale = 1, warp = 0, hue = 0, hueT = 0;
let banner = null, newRecord = false, coinChain = 0, coinChainT = 0;
let hiscore = 0; try { hiscore = +localStorage.getItem('neondash_hi') || 0; } catch (e) { }
const after = (t, fn) => timers.push({ t, fn });
const showBanner = (text, sub, color) => banner = { text, sub, color, t: 0, dur: 2 };
const meters = () => Math.floor(dist / 50);

function newPlayer() { return { x: W * .22, y: GY, vy: 0, ground: true, jumps: 0, slideT: 0, sliding: false, phase: 0, spin: 0, squash: 0, shield: false, magnetT: 0, x2T: 0, dead: false, ghostT: 0, tail: [], hx: W * .22, hy: GY - 64 }; }
function reset() {
  pl = newPlayer();
  obs = []; gaps = []; plats = []; coins = []; items = []; parts = []; texts = []; timers = []; ghosts = [];
  spd = 430; dist = 0; score = 0; dispScore = 0; coinCount = 0; stomps = 0; nextX = W + 300; milestone = 500;
  paused = false; newRecord = false; slowmo = 0; timeScale = 1; hueT = 0; coinChain = 0;
}
function startGame() {
  reset(); state = 'play'; warp = 3;
  showBanner('READY... GO!', '장애물을 피해 최대한 멀리 달려라!', '#2bd9ff'); SFX.speed();
}
function gameOver() {
  state = 'over'; overT = 0;
  postScore(score);
  if (score > hiscore) { hiscore = score; newRecord = true; try { localStorage.setItem('neondash_hi', hiscore); } catch (e) { } }
}

// ---------- 파티클 ----------
function P(o) { if (parts.length < 1600) parts.push(o); }
function spark(x, y, a, s, color, life, size = 2) { P({ kind: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, size, color, drag: .9 }); }
function ring(x, y, r1, color, life = .5, size = 4) { P({ kind: 'ring', x, y, r0: 2, r1, size, color, life, max: life }); }
function addText(x, y, text, color = '#fff', size = 18, dur = .9, big = false) { texts.push({ x, y, text, color, size, dur, t: 0, big }); }
function dust(x, y, n, power = 1) {
  for (let i = 0; i < n; i++) P({ kind: 'dust', x: x + rand(-10, 10), y, vx: rand(-200, 60) * power - spd * .2, vy: rand(-90, -10) * power, life: rand(.3, .6), max: .6, size: rand(3, 7), drag: .92 });
}
function explode(x, y, s, col) {
  P({ kind: 'glow', x, y, vx: 0, vy: 0, life: .35, max: .35, size: 70 * s, color: '#ffffff', grow: .6 });
  P({ kind: 'glow', x, y, vx: 0, vy: 0, life: .6, max: .6, size: 110 * s, color: col, grow: .8 });
  ring(x, y, 120 * s, col, .5, 7 * s); ring(x, y, 190 * s, '#ffffff', .6, 2);
  for (let i = 0; i < 30 * s; i++) spark(x, y, Math.random() * TAU, rand(150, 650), Math.random() < .4 ? '#ffffff' : Math.random() < .5 ? '#ff3df0' : col, rand(.3, .8), 3);
  for (let i = 0; i < 10 * s; i++) { const a = Math.random() * TAU, sp = rand(100, 380); P({ kind: 'debris', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 150, g: 900, life: rand(.6, 1.2), max: 1.2, size: rand(2, 5), rot: 0, vr: rand(-15, 15), color: col, drag: .98 }); }
}

// ---------- 동작 ----------
function jump() {
  if (state !== 'play' || paused || pl.dead) return;
  if (pl.ground || pl.coyote > 0) {
    pl.vy = -880; pl.ground = false; pl.jumps = 1; pl.coyote = 0; pl.sliding = false; pl.slideT = 0; pl.squash = -1;
    dust(pl.x, pl.y, 8); SFX.jump();
  } else if (pl.jumps < 2) {
    pl.vy = -800; pl.jumps = 2; pl.spin = 1; pl.squash = -1;
    ring(pl.x, pl.y - 30, 50, '#ff3df0', .35, 4);
    for (let i = 0; i < 12; i++) spark(pl.x, pl.y, Math.PI / 2 + rand(-1, 1), rand(150, 300), '#ff9bf4', .35, 2);
    SFX.djump();
  }
}
function slideStart() {
  if (state !== 'play' || paused || pl.dead) return;
  if (pl.ground) { if (!pl.sliding) { pl.sliding = true; pl.slideT = .45; SFX.slide(); dust(pl.x, pl.y, 10, 1.4); } }
  else { pl.vy = Math.max(pl.vy, 1300); pl.fastFall = true; }
}
function overGap(x) { for (const g of gaps) if (x > g.x + 6 && x < g.x + g.w - 6) return true; return false; }

function spawnPattern() {
  const x0 = nextX, m = meters();
  const r = Math.random();
  let w = 0;
  const coinArc = (cx, cy, n, span, height) => { for (let i = 0; i < n; i++) { const t = n === 1 ? .5 : i / (n - 1); coins.push({ x: cx - span / 2 + span * t, y: cy - Math.sin(t * Math.PI) * height, t: Math.random() * TAU }); } };
  const coinLine = (x, y, n) => { for (let i = 0; i < n; i++) coins.push({ x: x + i * 34, y, t: i * .3 }); };
  if (r < .26) {
    const n = 1 + (Math.random() * Math.min(3, 1 + m / 400) | 0);
    w = n * 34;
    obs.push({ type: 'spike', x: x0, w, h: 34 });
    coinArc(x0 + w / 2, GY - 90, 5, w + 120, 70);
  } else if (r < .42) {
    w = 40;
    obs.push({ type: 'gate', x: x0, w, t: 0 });
    coinLine(x0 - 60, GY - 16, 5);
  } else if (r < .6) {
    w = clamp(spd * .26 + rand(-20, 40), 110, 280);
    gaps.push({ x: x0, w });
    coinArc(x0 + w / 2, GY - 110, 6, w + 40, 80);
  } else if (r < .76) {
    const y = GY - rand(56, 70);
    obs.push({ type: 'drone', x: x0 + 20, y, by: y, w: 40, t: Math.random() * TAU, dead: false });
    coinLine(x0 - 30, GY - 150, 4);
    w = 60;
  } else {
    const pw = rand(220, 380), py = GY - rand(100, 140);
    plats.push({ x: x0, y: py, w: pw });
    coinLine(x0 + 20, py - 26, Math.floor((pw - 40) / 34));
    if (m > 150 && Math.random() < .6) { const sw = 68; obs.push({ type: 'spike', x: x0 + pw / 2 - sw / 2, w: sw, h: 34 }); }
    w = pw;
  }
  if (Math.random() < .12) items.push({ x: x0 + w / 2, y: GY - 190, type: ['magnet', 'shield', 'x2'][Math.random() * 3 | 0], t: 0 });
  nextX += w + spd * .55 + rand(120, 360);
}

function die() {
  if (pl.dead) return;
  if (pl.shield) {
    pl.shield = false; pl.invT = 1.2; shake = 14; hitstop = .06; flash = .4; flashColor = '120,240,255';
    ring(pl.x, pl.y - 30, 130, '#2bd9ff', .5, 6);
    for (let i = 0; i < 24; i++) spark(pl.x, pl.y - 30, i / 24 * TAU, rand(200, 420), '#9ff3ff', .5, 2.5);
    addText(pl.x, pl.y - 90, 'SHIELD BREAK', '#2bd9ff', 20); SFX.shield();
    return;
  }
  pl.dead = true;
  explode(pl.x, pl.y - 30, 1.6, '#2bd9ff');
  shake = 30; flash = .9; flashColor = '255,50,90'; hitstop = .14; slowmo = 1.6;
  SFX.death();
  after(1.6, gameOver);
}

function updateWorld(dt) {
  for (let i = timers.length - 1; i >= 0; i--) { timers[i].t -= dt; if (timers[i].t <= 0) { const f = timers[i].fn; timers.splice(i, 1); f(); } }
  const playing = state === 'play' && !pl.dead;
  const curSpd = state === 'title' ? 520 : pl.dead ? spd * .15 : spd;
  const dx = curSpd * dt;
  for (const L of layers) {
    for (const it of L.items) it.x -= dx * L.par;
    const first = L.items[0];
    if (first && first.x + first.w < -30) {
      L.items.shift();
      const lastIt = L.items[L.items.length - 1], nb = newBuilding(L);
      nb.x = lastIt.x + lastIt.w + (L.mountain ? -nb.w * .35 : rand(4, 18));
      L.items.push(nb);
    }
  }
  for (const s of stars) { s.x -= dx * .02; if (s.x < 0) s.x += W; }
  if (state === 'title') {
    pl.phase += dt * curSpd * .028;
    for (const c of [obs, gaps, plats, coins, items]) c.length = 0;
    trailHair(dt, curSpd);
    if (Math.random() < dt * 20) dust(pl.x - 8, GY, 1, .5);
    return;
  }
  if (playing) {
    dist += dx;
    spd = Math.min(1150, 430 + meters() * .45);
    if (meters() >= milestone) {
      showBanner('SPEED UP!', milestone + 'm 돌파!', '#ff3df0'); SFX.speed();
      warp = 3; hueT += 60; flash = .3; flashColor = '255,61,240'; score += milestone;
      milestone += 500;
    }
  }
  hue = lerp(hue, hueT, 1 - Math.pow(.3, dt));
  nextX -= dx;
  if (playing) while (nextX < W + 200) spawnPattern();
  for (const arr of [obs, gaps, plats, coins, items]) for (const o of arr) o.x -= dx;
  obs = obs.filter(o => o.x + o.w > -100 && !o.gone); gaps = gaps.filter(g => g.x + g.w > -50); plats = plats.filter(p => p.x + p.w > -50);
  coins = coins.filter(c => c.x > -50 && !c.got); items = items.filter(i => i.x > -50 && !i.got);
  for (const o of obs) {
    if (o.type === 'drone') { o.t += dt; if (!o.dead) o.y = o.by + Math.sin(o.t * 4) * 10; else { o.vy += 1600 * dt; o.y += o.vy * dt; o.rot += dt * 10; if (Math.random() < .5) P({ kind: 'smoke', x: o.x, y: o.y, vx: rand(-40, 40) - spd * .3, vy: rand(-60, -20), life: .5, max: .5, size: rand(4, 8), drag: .95 }); if (o.y > H + 50) o.gone = true; } }
    if (o.type === 'gate') o.t += dt;
  }
  if (!pl.dead) updatePlayer(dt);
  for (const g of ghosts) { g.t += dt; g.x -= dx * .6; }
  ghosts = ghosts.filter(g => g.t < .25);
  coinChainT -= dt; if (coinChainT <= 0) coinChain = 0;
  score = Math.max(score, 0);
  dispScore = score - dispScore < 1 ? score : lerp(dispScore, score, 1 - Math.pow(.002, dt));
}
// 포니테일 물리
function trailHair(dt, sp) {
  const t = pl.tail;
  if (!t.length) for (let i = 0; i < 9; i++) t.push({ x: pl.hx - i * 4, y: pl.hy });
  t[0].x = pl.hx; t[0].y = pl.hy;
  const k = 1 - Math.pow(.0004, dt), speedK = clamp(sp / 900, .4, 1.2);
  for (let i = 1; i < t.length; i++) {
    const p = t[i - 1], tx = p.x - 4.5 * speedK - (pl.ground ? 0 : 1), ty = p.y + 1.1 + Math.sin(T * 14 - i * .9) * 1.4 * (i / t.length) - (pl.vy < 0 && !pl.ground ? 1.5 : 0) + (pl.vy > 200 ? -2 : 0);
    t[i].x = lerp(t[i].x, tx, k); t[i].y = lerp(t[i].y, ty, k);
  }
}
function updatePlayer(dt) {
  const p = pl, prevY = p.y;
  p.invT = (p.invT || 0) - dt;
  p.magnetT -= dt; p.x2T -= dt;
  const g = p.vy < 0 && jumpHeld ? 2000 : 3000;
  if (!p.ground) { p.vy += g * dt; p.y += p.vy * dt; p.coyote = (p.coyote || 0) - dt; }
  let support = null;
  if (p.vy >= 0) {
    for (const pf of plats) if (p.x + 10 > pf.x && p.x - 10 < pf.x + pf.w && prevY <= pf.y + 2 && p.y >= pf.y) { support = pf.y; break; }
    if (support === null && !overGap(p.x) && prevY <= GY + 2 && p.y >= GY) support = GY;

    drawGlow(pl.x, pl.y - 30, 54, '#2bd9ff', .3);
    ctx.strokeStyle = `rgba(120,240,255,${.5 + .3 * Math.sin(T * 8)})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(pl.x, pl.y - 30, 42 + Math.sin(T * 6) * 2, 0, TAU); ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }
  if (pl.magnetT > 0) {
    ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(255,61,240,${.3 * Math.min(1, pl.magnetT)})`; ctx.lineWidth = 2;
    for (let i = 0; i < 2; i++) { const r = ((T * 200 + i * 130) % 260); ctx.globalAlpha = 1 - r / 260; ctx.beginPath(); ctx.arc(pl.x, pl.y - 30, 260 - r, 0, TAU); ctx.stroke(); }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
}
function drawParticles() {
  for (const p of parts) {
    const k = Math.max(0, p.life / p.max);
    if (p.kind === 'dust') { ctx.fillStyle = `rgba(200,180,255,${.35 * k})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.5 - k * .5), 0, TAU); ctx.fill(); }
    else if (p.kind === 'smoke') { ctx.fillStyle = `rgba(60,50,70,${.4 * k})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (2 - k), 0, TAU); ctx.fill(); }
    else if (p.kind === 'debris') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = k; ctx.fillStyle = p.color; ctx.fillRect(-p.size, -p.size * .4, p.size * 2, p.size * .8); ctx.restore(); }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const p of parts) {
    const k = Math.max(0, p.life / p.max);
    if (p.kind === 'spark') { ctx.strokeStyle = p.color; ctx.globalAlpha = k; ctx.lineWidth = p.size * (.4 + k * .6); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * .035, p.y - p.vy * .035); ctx.stroke(); }
    else if (p.kind === 'glow') drawGlow(p.x, p.y, p.size * (p.grow ? 1 + (1 - k) * p.grow : .4 + .6 * k), p.color, k);
    else if (p.kind === 'ring') { const r = p.r0 + (p.r1 - p.r0) * ease.outCubic(1 - k); ctx.strokeStyle = p.color; ctx.globalAlpha = k; ctx.lineWidth = p.size * k + .5; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.stroke(); }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
function drawSpeedLines() {
  const s = state === 'play' ? (spd - 430) / 720 + warp * .3 : 0;
  if (s <= .05) return;
  ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(200,240,255,${Math.min(.45, s * .4)})`; ctx.lineWidth = 2;
  for (let i = 0; i < 16; i++) {
    const y = (i * 137.7) % (H * .95), x = W - ((T * (1500 + i * 90) + i * 300) % (W + 400));
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 60 + s * 120, y); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}
function drawTexts() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts) {
    const pin = Math.min(1, t.t / (t.big ? .3 : .18));
    const sc = ease.outBack(pin);
    const a = 1 - Math.max(0, (t.t - t.dur * .6) / (t.dur * .4));
    const y = t.y - (t.big ? 0 : ease.outCubic(t.t / t.dur) * 40);
    ctx.save(); ctx.translate(t.x, y); ctx.scale(sc, sc); ctx.globalAlpha = Math.max(0, a);
    ctx.font = `900 ${t.size}px "Segoe UI",sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(t.text, 0, 0);
    ctx.fillStyle = t.color; ctx.fillText(t.text, 0, 0);
    ctx.restore();
  }
}
function chromaText(text, x, y, font, color, off = 3, spacing = 0) {
  ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.letterSpacing = spacing + 'px';
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(255,40,100,.8)'; ctx.fillText(text, x - off, y);
  ctx.fillStyle = 'rgba(40,220,255,.8)'; ctx.fillText(text, x + off, y);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = color; ctx.fillText(text, x, y); ctx.letterSpacing = '0px';
}
function drawBanner() {
  if (!banner) return;
  const b = banner, t = b.t, d = b.dur;
  const inT = clamp(t / .45, 0, 1), outT = clamp((t - (d - .4)) / .4, 0, 1);
  const y = H * .3, bandH = 96 * ease.outCubic(inT) * (1 - ease.outCubic(outT));
  const [r, g, bb] = rgb(b.color);
  ctx.save(); ctx.translate(W / 2, y); ctx.transform(1, 0, -.25, 1, 0, 0);
  ctx.fillStyle = `rgba(0,0,0,${.5 * (1 - outT)})`; ctx.fillRect(-W, -bandH / 2, W * 2, bandH);
  ctx.fillStyle = `rgba(${r},${g},${bb},${1 - outT})`;
  const lw = W * 1.4 * ease.outCubic(inT);
  ctx.fillRect(-lw / 2, -bandH / 2 - 2, lw, 3); ctx.fillRect(-lw / 2, bandH / 2 - 1, lw, 3);
  ctx.restore();
  const ox = (1 - ease.outBack(inT)) * W * .8 - ease.outCubic(outT) * W;
  ctx.globalAlpha = 1 - outT;
  chromaText(b.text, W / 2 + ox, y - 10, `900 italic ${Math.min(64, W / 9)}px "Segoe UI",sans-serif`, '#ffffff', 2 + (1 - inT) * 14, 4);
  ctx.globalAlpha = clamp((t - .3) / .3, 0, 1) * (1 - outT);
  ctx.font = `600 ${Math.min(17, W / 26)}px "Segoe UI",sans-serif`; ctx.fillStyle = b.color; ctx.textAlign = 'center';
  ctx.fillText(b.sub, W / 2 - ox * .5, y + 30);
  ctx.globalAlpha = 1;
}
function hudPanel(x, y, w, h, col) {
  const g = ctx.createLinearGradient(x, y, x, y + h); g.addColorStop(0, 'rgba(30,14,60,.72)'); g.addColorStop(1, 'rgba(8,2,20,.72)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.fill();
  ctx.strokeStyle = col; ctx.globalAlpha = .5; ctx.lineWidth = 1.2; ctx.stroke(); ctx.globalAlpha = 1;
}
function drawHUD() {
  hudPanel(12, 10, 176, 112, '#2bd9ff');
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.font = '700 11px "Segoe UI",sans-serif'; ctx.fillStyle = '#7febff'; ctx.letterSpacing = '3px'; ctx.fillText('SCORE', 24, 30); ctx.letterSpacing = '0px';
  ctx.shadowColor = '#2bd9ff'; ctx.shadowBlur = 14;
  ctx.font = '800 28px Consolas,"Courier New",monospace'; ctx.fillStyle = '#ffffff'; ctx.fillText(Math.floor(dispScore).toLocaleString(), 24, 60);
  ctx.shadowBlur = 0;
  ctx.font = '800 17px Consolas,monospace'; ctx.fillStyle = '#ff9bf4'; ctx.fillText(meters() + ' m', 24, 84);
  const sk = (spd - 430) / 720;
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(24, 96, 150, 5);
  const sg = ctx.createLinearGradient(24, 0, 174, 0); sg.addColorStop(0, '#2bd9ff'); sg.addColorStop(1, '#ff3df0');
  ctx.fillStyle = sg; ctx.fillRect(24, 96, 150 * clamp(sk, .02, 1), 5);
  ctx.font = '700 9px "Segoe UI",sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillText('SPEED', 24, 114);
  hudPanel(W - 172, 10, 160, 78, '#ff3df0');
  ctx.textAlign = 'right';
  ctx.font = '700 11px "Segoe UI",sans-serif'; ctx.fillStyle = '#ff9bf4'; ctx.letterSpacing = '3px'; ctx.fillText('HI-SCORE', W - 24, 30); ctx.letterSpacing = '0px';
  ctx.font = '800 19px Consolas,monospace'; ctx.fillStyle = '#ffffff'; ctx.fillText(Math.floor(Math.max(hiscore, score)).toLocaleString(), W - 24, 53);
  drawCoin({ x: W - 100, y: 72, t: 0 });
  ctx.textAlign = 'right'; ctx.font = '800 16px Consolas,monospace'; ctx.fillStyle = '#ffd23f'; ctx.fillText('× ' + coinCount, W - 24, 78);
  const act = [];
  if (pl.magnetT > 0) act.push(['U', pl.magnetT / 8, '#ff3df0']);
  if (pl.x2T > 0) act.push(['×2', pl.x2T / 10, '#ffd23f']);
  if (pl.shield) act.push(['S', 1, '#2bd9ff']);
  act.forEach(([l, k, c], i) => {
    const x = W - 34 - i * 36, y = 108;
    ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 13, 0, TAU); ctx.stroke();
    ctx.strokeStyle = c; ctx.beginPath(); ctx.arc(x, y, 13, -Math.PI / 2, -Math.PI / 2 + TAU * k); ctx.stroke();
    ctx.fillStyle = c; ctx.font = '900 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(l, x, y + 1);
  });
  if (isTouch && state === 'play' && dist < 3000) {
    ctx.globalAlpha = .5; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '700 14px "Segoe UI",sans-serif'; ctx.fillStyle = '#ffffff';
    ctx.fillText('◀ 왼쪽 탭: 슬라이드', W * .2, H - 30); ctx.fillText('오른쪽 탭: 점프 ▶', W * .7, H - 30);
    ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.moveTo(W * .4, GY + 10); ctx.lineTo(W * .4, H); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }
  if (muted) { ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic'; ctx.font = '600 11px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillText('MUTE', W - 20, 140); }
}
function drawLetters(text, y0, size, introT, bounce, col2) {
  ctx.font = `900 italic ${size}px "Segoe UI",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const ws = [...text].map(c => ctx.measureText(c).width), tot = ws.reduce((a, b) => a + b, 0);
  let x = W / 2 - tot / 2;
  const sweep = ((T * .5) % 1.6 - .3) * tot;
  [...text].forEach((c, i) => {
    const k = clamp((introT - i * .06) / .7, 0, 1);
    const e = bounce ? ease.outBounce(k) : ease.outBack(k);
    const cx = bounce ? x + ws[i] / 2 : x + ws[i] / 2 + (1 - e) * W;
    const cy = bounce ? lerp(-100, y0, e) : y0 + Math.sin(T * 4 + i * .6) * 6;
    ctx.save(); ctx.translate(cx, cy); ctx.transform(1, 0, -.15, 1, 0, 0);
    ctx.lineWidth = size * .12; ctx.strokeStyle = 'rgba(20,0,40,.85)'; ctx.lineJoin = 'round'; ctx.strokeText(c, 0, size * .05);
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,40,200,.85)'; ctx.fillText(c, -4, 0); ctx.fillStyle = 'rgba(40,220,255,.85)'; ctx.fillText(c, 4, 0);
    ctx.globalCompositeOperation = 'source-over';
    const lx = (x + ws[i] / 2) - (W / 2 - tot / 2);
    const g = ctx.createLinearGradient(0, -size / 2, 0, size / 2); g.addColorStop(0, '#ffffff'); g.addColorStop(.55, Math.abs(lx - sweep) < size * .5 ? '#ffffff' : '#fff0fb'); g.addColorStop(1, col2);
    ctx.fillStyle = g; ctx.fillText(c, 0, 0); ctx.restore();
    x += ws[i];
  });
}
function drawTitle() {
  const size = Math.min(110, W / 6.5);
  drawLetters('NEON', H * .2, size, T, false, '#7febff');
  drawLetters('DASH', H * .2 + size * .95, size, T - .25, false, '#ff9bf4');
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = clamp((T - 1.2) / .5, 0, 1) * (.55 + .45 * Math.sin(T * 5));
  ctx.font = `800 ${Math.min(24, W / 18)}px "Segoe UI",sans-serif`; ctx.fillStyle = '#ffffff';
  ctx.fillText(isTouch ? '화면을 탭하여 달리기!' : 'SPACE 를 눌러 달리기!', W / 2, GY + (H - GY) * .35);
  ctx.globalAlpha = clamp((T - 1.4) / .5, 0, 1) * .85;
  ctx.font = `500 ${Math.min(13, W / 32)}px "Segoe UI",sans-serif`; ctx.fillStyle = '#e0d4ff';
  ctx.fillText(isTouch ? '오른쪽 탭: 점프 (2단 점프) · 왼쪽 탭: 슬라이드 / 급강하' : '점프: SPACE / ↑ (길게 = 높이, 공중에서 2단 점프) · 슬라이드 / 급강하: ↓ · 일시정지: P', W / 2, GY + (H - GY) * .6);
  ctx.fillText('드론은 밟아서 처치! · 레이저 게이트는 슬라이드로 통과', W / 2, GY + (H - GY) * .6 + 20);
  if (hiscore > 0) { ctx.fillStyle = '#ff9bf4'; ctx.font = '700 14px Consolas,monospace'; ctx.fillText('HI-SCORE  ' + Math.floor(hiscore).toLocaleString(), W / 2, GY + (H - GY) * .6 + 46); }
  ctx.globalAlpha = 1;
}
function drawGameOver() {
  const a = clamp(overT / .8, 0, 1);
  ctx.fillStyle = `rgba(5,0,15,${.65 * a})`; ctx.fillRect(0, 0, W, H);
  drawLetters('WIPEOUT!', H * .2, Math.min(90, W / 7), overT, true, '#ff9bf4');
  const pk = ease.outBack(clamp((overT - .7) / .5, 0, 1));
  if (pk > 0) {
    const pw = Math.min(420, W - 40), ph = 220, px = W / 2 - pw / 2, py = H * .33;
    ctx.save(); ctx.translate(W / 2, py + ph / 2); ctx.scale(pk, pk); ctx.translate(-W / 2, -(py + ph / 2));
    hudPanel(px, py, pw, ph, '#ff3df0');
    ctx.restore();
  }
  const rows = [['SCORE', Math.floor(score * ease.outCubic(clamp((overT - .9) / 1.2, 0, 1))).toLocaleString(), '#ffffff'],
    ['DISTANCE', meters() + ' m', '#7febff'], ['COINS', coinCount, '#ffd23f'], ['STOMPS', stomps, '#ffb12b']];
  rows.forEach((r, i) => {
    const k = ease.outCubic(clamp((overT - .9 - i * .12) / .4, 0, 1)), y = H * .33 + 42 + i * 42;
    ctx.globalAlpha = k; ctx.textBaseline = 'middle';
    ctx.font = '700 14px "Segoe UI",sans-serif'; ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.letterSpacing = '3px';
    ctx.fillText(r[0], W / 2 - 16 - (1 - k) * 60, y); ctx.letterSpacing = '0px';
    ctx.font = `800 ${i === 0 ? 28 : 21}px Consolas,monospace`; ctx.textAlign = 'left'; ctx.fillStyle = r[2];
    ctx.fillText(r[1], W / 2 + 16 + (1 - k) * 60, y);
  });
  ctx.globalAlpha = 1;
  if (newRecord && overT > 2) {
    const s = 1 + Math.sin(T * 8) * .08;
    ctx.save(); ctx.translate(W / 2, H * .33 + 250); ctx.scale(s, s); ctx.rotate(-.05);
    chromaText('★ NEW RECORD ★', 0, 0, '900 italic 26px "Segoe UI",sans-serif', `hsl(${T * 200 % 360},100%,70%)`, 2);
    ctx.restore();
  }
  if (overT > 1.5) {
    ctx.globalAlpha = .55 + .45 * Math.sin(T * 5); ctx.font = '800 20px "Segoe UI",sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#ffffff';
    ctx.fillText(isTouch ? '탭하여 다시 달리기' : 'SPACE 로 다시 달리기', W / 2, H * .9); ctx.globalAlpha = 1;
  }
}
function inMenuBtn(x, y) { return Math.abs(x - W / 2) < 52 && y > 8 && y < 46; }
function drawMenuBtn() {
  const hov = .5 + .5 * Math.sin(T * 3);
  ctx.fillStyle = 'rgba(10,5,25,.6)'; ctx.strokeStyle = `rgba(127,235,255,${.4 + hov * .4})`; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(W / 2 - 50, 10, 100, 34, 17); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffffff'; ctx.font = '700 13px "Segoe UI",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('◀ MENU (Esc)', W / 2, 27);
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  shakeX = shakeY = 0;
  if (shake > .3) { shakeX = rand(-1, 1) * shake; shakeY = rand(-1, 1) * shake; ctx.translate(shakeX, shakeY); }
  drawSky();
  drawLayers();
  drawGround();
  drawSpeedLines();
  drawObjects();
  drawPlayer();
  drawParticles();
  drawTexts();
  ctx.restore();
  if (vignette) ctx.drawImage(vignette, 0, 0, W, H);
  if (state === 'title') drawTitle();
  else { drawBanner(); drawHUD(); if (state === 'over') drawGameOver(); }
  if (flash > 0) { ctx.fillStyle = `rgba(${flashColor},${flash * .7})`; ctx.fillRect(0, 0, W, H); }
  if (state !== 'play') drawMenuBtn();
  if (paused && state === 'play') {
    ctx.fillStyle = 'rgba(0,0,10,.6)'; ctx.fillRect(0, 0, W, H);
    chromaText('PAUSED', W / 2, H / 2, `900 italic ${Math.min(80, W / 7)}px "Segoe UI",sans-serif`, '#ffffff', 3, 10);
    ctx.font = '600 15px "Segoe UI",sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.fillText(isTouch ? '탭하여 계속' : 'P 를 눌러 계속', W / 2, H / 2 + 60);
  }
}

let last = performance.now();
function frame(now) {
  const rdt = Math.min(.05, (now - last) / 1000); last = now;
  update(rdt); draw();
  requestAnimationFrame(frame);
}
resize();
reset();
requestAnimationFrame(frame);
</script>
