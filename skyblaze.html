<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sky Blaze</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  html,body{margin:0;height:100%;background:#bdf1ff;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const GAME_ID = 'sky';
// 바깥쪽 모든 화면(런처)에 메시지 전달. 게시된 페이지는 한 겹 더 감싸일 수 있음
function postUp(msg) { let sent = false; try { let w = window; for (let i = 0; i < 5 && w.parent && w.parent !== w; i++) { w = w.parent; try { w.postMessage(msg, '*'); sent = true; } catch (e) { } } } catch (e) { } return sent; }
function postScore(sc) { postUp({ type: 'score', game: GAME_ID, score: Math.floor(sc) }); }
function goMenu() { if (!postUp({ type: 'menu' })) location.href = 'index.html'; }
// =====================================================================
//  SKY BLAZE — 귀여운 카툰 종스크롤 슈팅 (Office Dash 스타일)
// =====================================================================
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const angTo = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);
const ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  outBack: t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * TAU / 3) + 1,
  outBounce: t => { const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375; return n * (t -= 2.625 / d) * t + .984375; }
};
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// ---------- 카툰 색 & 헬퍼 (Office Dash 스타일) ----------
const OUT = '#1d3236';
const C = { mint: '#19c9a3', mintD: '#0e9a7c', mintL: '#9ff0dc', gold: '#ffc83d', coral: '#ff6b6b', sky: '#5cc8ff', pink: '#ff8fb8', lav: '#b9a6ff', skin: '#ffe0c8', hair: '#2b2a3a', cream: '#fff6e0', orange: '#e07a2f' };
const FONT = '"Jua","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
const PASTEL = ['#fff1c9', '#ffd9cf', '#d8f1ff', '#d4f7e6', '#ffe4f0', '#e8e2ff', '#fff6e0'];
const ROOFS = ['#ff9f8a', '#ffc83d', '#9fd7ff', '#c9b6ff', '#ff9ec4', '#7fe0c0'];
const CONFETTI = ['#ff6b6b', '#ffc83d', '#5cc8ff', '#19c9a3', '#ff8fb8', '#b9a6ff'];
function ol(fill, lw = 2.5) { if (fill) { ctx.fillStyle = fill; ctx.fill(); } ctx.lineWidth = lw; ctx.strokeStyle = OUT; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); }
function cartoonText(text, x, y, size, fill = '#ffffff', stroke = OUT, lw = 0) {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = lw || Math.max(3, size * .16); ctx.strokeStyle = stroke; ctx.strokeText(text, x, y + size * .04);
  ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y);
}
function starPath(r, inner = .45) { ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = (i % 2 ? inner : 1) * r; ctx.lineTo(Math.cos(a) * q, Math.sin(a) * q); } ctx.closePath(); }
function rgb(hex) { return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)]; }
// 큰 눈 (눈동자가 a 방향을 바라봄)
function eye(x, y, rx, ry, a, lw = 2) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ol('#ffffff', lw);
  const px = x + Math.cos(a) * rx * .32, py = y + Math.sin(a) * ry * .32;
  ctx.fillStyle = '#2a2230'; ctx.beginPath(); ctx.ellipse(px, py, rx * .55, ry * .6, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffffff'; circ(px - rx * .2, py - ry * .25, rx * .22); ctx.fill(); circ(px + rx * .18, py + ry * .2, rx * .1); ctx.fill();
}
// 눈썹 (ang>0 이면 오른쪽 끝이 내려감)
function brow(x, y, len, ang, lw = 2.6) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.strokeStyle = OUT; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-len / 2, 0); ctx.lineTo(len / 2, 0); ctx.stroke(); ctx.restore();
}

// ---------- 오디오 (WebAudio 합성) ----------
let AC = null, master = null, noiseBuf = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .32; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(type, f1, f2, dur, vol, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, f1, f2) {
  if (!AC || muted) return;
  const t = AC.currentTime, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; fl.type = 'lowpass';
  fl.frequency.setValueAtTime(f1, t); fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
let boomCount = 0;
const SFX = {
  shoot() { tone('square', 1200, 500, .05, .025); },
  hit() { tone('square', 320, 140, .04, .035); },
  boom(s) { if (boomCount > 4) return; boomCount++; noise(.35 * s + .2, Math.min(.7, .35 * s), 2500, 60); tone('sine', 140, 30, .3 * s + .1, .35); },
  power() { tone('triangle', 440, 1760, .22, .18); tone('sine', 660, 1980, .3, .1, .08); },
  bomb() { noise(1.6, .9, 6000, 40); tone('sawtooth', 220, 20, 1.3, .3); },
  hurt() { noise(.5, .7, 2500, 80); tone('sawtooth', 420, 50, .5, .3); },
  warn() { tone('square', 520, 520, .18, .1); tone('square', 390, 390, .18, .1, .2); },
  dash() { tone('sawtooth', 200, 900, .15, .05); },
  graze() { tone('sine', 1800, 2400, .05, .03); },
  clear() { [523, 659, 784, 1046].forEach((f, i) => tone('triangle', f, f, .25, .15, i * .1)); }
};

// ---------- 입력 ----------
const keys = {};
let pDown = false, lastPX = 0, lastPY = 0, pdx = 0, pdy = 0, paused = false;
addEventListener('keydown', e => {
  keys[e.code] = true; initAudio();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyM') muted = !muted;
  if (state === 'play') {
    if (e.code === 'KeyX' || e.code === 'KeyB') bomb();
    if (e.code === 'KeyP' || e.code === 'Escape') paused = !paused;
  } else if (e.code === 'Escape') {
    goMenu();
  } else if (e.code === 'Space' || e.code === 'Enter') {
    if (state === 'title' || (state === 'over' && overT > 1.5)) startGame();
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
cv.addEventListener('pointerdown', e => {
  initAudio();
  if (state !== 'play' && inMenuBtn(e.clientX, e.clientY)) { goMenu(); return; }
  if (state === 'title') { startGame(); return; }
  if (state === 'over') { if (overT > 1.5) startGame(); return; }
  if (paused) { paused = false; return; }
  if (isTouch && Math.hypot(e.clientX - (W - 64), e.clientY - (H - 74)) < 44) { bomb(); return; }
  pDown = true; lastPX = e.clientX; lastPY = e.clientY;
});
addEventListener('pointermove', e => {
  if (!pDown) return;
  pdx += e.clientX - lastPX; pdy += e.clientY - lastPY; lastPX = e.clientX; lastPY = e.clientY;
});
addEventListener('pointerup', () => pDown = false);
addEventListener('pointercancel', () => pDown = false);
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });

// ---------- 배경 (밝은 카툰 하늘, 아래로 스크롤) ----------
const THEMES = ['morning', 'sunset', 'ocean', 'night'];
const THEME = {
  morning: { sky: ['#6fd3ff', '#a8e9ff', '#e4fcff'], cloud: '#ffffff', cshade: '#e1f4fb', accent: '#19c9a3' },
  sunset: { sky: ['#ff9fc2', '#ffc4a8', '#fff1c9'], cloud: '#fff8fb', cshade: '#ffdde9', accent: '#ff6f9f' },
  ocean: { sky: ['#3dbff2', '#68d8ff', '#a4efff'], cloud: '#ffffff', cshade: '#d4f1ff', accent: '#2a9fe8' },
  night: { sky: ['#4c4fa6', '#6c69c8', '#a08fe6'], cloud: '#f1ecff', cshade: '#d3c8f8', accent: '#8f6cff' },
};
const theme = () => THEMES[((typeof stage === 'number' ? stage : 1) - 1) % 4];
let bgObj = { islands: [], cloudsFar: [], cloudsNear: [], glints: [], moon: null }, bgScroll = 0;
const SPR = {};
function makeSprite(w, h, fn, sc = Math.max(1, DPR)) {
  const c = document.createElement('canvas'); c.width = Math.ceil(w * sc); c.height = Math.ceil(h * sc); c.lw = w; c.lh = h;
  const old = ctx; ctx = c.getContext('2d'); ctx.scale(sc, sc);
  try { fn(w, h); } finally { ctx = old; }
  return c;
}
function cloudPuffs() {
  const p = [], n = 6 + (Math.random() * 3 | 0);
  for (let i = 0; i < n; i++) { const t = i / (n - 1), bump = Math.sin(t * Math.PI); p.push([50 + t * 200 + rand(-8, 8), 92 - bump * 26 + rand(-6, 6), rand(24, 34) * (.75 + bump * .45)]); }
  for (let i = 0; i < 4; i++) p.push([80 + i * 46 + rand(-6, 6), 112 + rand(-4, 4), rand(20, 26)]);
  return p;
}
function puffsPath(puffs, grow = 0) { ctx.beginPath(); for (const [x, y, r] of puffs) { ctx.moveTo(x + r + grow, y); ctx.arc(x, y, r + grow, 0, TAU); } }
function makeCloud(puffs, fill, shadeC) {
  return makeSprite(300, 170, () => {
    puffsPath(puffs); ctx.lineWidth = 6; ctx.strokeStyle = OUT; ctx.lineJoin = 'round'; ctx.stroke();
    ctx.fillStyle = fill; ctx.fill();
    ctx.save(); puffsPath(puffs); ctx.clip();
    ctx.fillStyle = shadeC; for (const [x, y, r] of puffs) { circ(x, y + r * .42, r * .8); ctx.fill(); }
    ctx.fillStyle = fill; for (const [x, y, r] of puffs) { circ(x - r * .06, y - r * .16, r * .84); ctx.fill(); }
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for (let i = 1; i < puffs.length - 4; i += 2) { const [x, y, r] = puffs[i]; ctx.beginPath(); ctx.ellipse(x - r * .3, y - r * .45, r * .22, r * .12, -.5, 0, TAU); ctx.fill(); }
  });
}
function blobPath(pts, rx, ry, ox = 0, oy = 0) {
  const n = pts.length, P2 = pts.map(([x, y]) => [ox + x * rx, oy + y * ry]);
  const mid = i => [(P2[i][0] + P2[(i + 1) % n][0]) / 2, (P2[i][1] + P2[(i + 1) % n][1]) / 2];
  ctx.beginPath(); const m0 = mid(n - 1); ctx.moveTo(m0[0], m0[1]);
  for (let i = 0; i < n; i++) { const m = mid(i); ctx.quadraticCurveTo(P2[i][0], P2[i][1], m[0], m[1]); }
  ctx.closePath();
}
function treeTop(x, y, r, col) { circ(x, y, r); ol(col, 2.4); ctx.fillStyle = 'rgba(255,255,255,.35)'; circ(x - r * .3, y - r * .35, r * .3); ctx.fill(); }
function roofTop(x, y, w, h, col, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  rr(-w / 2, -h / 2, w, h, 4); ol(col, 2.4);
  rr(-w / 2 + 2, 1, w - 4, h / 2 - 3, 3); ctx.fillStyle = 'rgba(29,50,54,.12)'; ctx.fill();
  ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-w / 2 + 3, 0); ctx.lineTo(w / 2 - 3, 0); ctx.stroke();
  rr(w * .18, -h / 2 + 2, 5, 6, 1.5); ol('#ff8a6a', 1.6);
  ctx.restore();
}
function palm(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  for (let i = 0; i < 5; i++) { ctx.save(); ctx.rotate(i * TAU / 5 + .3); ctx.beginPath(); ctx.ellipse(0, -11, 5.5, 12, 0, 0, TAU); ol('#4fd99b', 2.2); ctx.restore(); }
  circ(0, 0, 4.5); ol('#c98a4a', 2);
  ctx.restore();
}
function makeIsland(th, k) {
  return makeSprite(240, 220, (w, h) => {
    const cx = w / 2, cy = h / 2, pts = [];
    for (let i = 0; i < 12; i++) { const a = i / 12 * TAU, q = rand(.82, 1); pts.push([Math.cos(a) * q, Math.sin(a) * q]); }
    ctx.fillStyle = 'rgba(29,50,54,.12)'; blobPath(pts, 96, 80, cx + 8, cy + 12); ctx.fill();
    if (th === 'ocean') {
      ctx.fillStyle = 'rgba(255,255,255,.7)'; blobPath(pts, 104, 88, cx, cy); ctx.fill();
      blobPath(pts, 90, 76, cx, cy); ol('#ffe7a8', 3);
      ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.ellipse(cx - 40, cy - 40, 18, 7, -.5, 0, TAU); ctx.fill();
      blobPath(pts, 56, 46, cx - 6, cy - 6); ol('#8ee6a4', 2.5);
      if (k === 1) roofTop(cx + 2, cy - 2, 28, 22, '#ffc83d', .2);
      if (k === 2) {
        circ(cx + 40, cy + 34, 13); ol('#ff8fb8', 2.2);
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.beginPath(); for (let i = 0; i < 3; i++) { const a = i * TAU / 3; ctx.moveTo(cx + 40, cy + 34); ctx.lineTo(cx + 40 + Math.cos(a) * 11, cy + 34 + Math.sin(a) * 11); } ctx.stroke();
        circ(cx + 40, cy + 34, 2.5); ol('#ffffff', 1.5);
      }
      const ps = k === 0 ? [[-14, -10, 1.1], [18, 8, 1], [-30, 22, .9]] : [[-26, -22, 1], [26, 20, .95]];
      for (const [x, y, s] of ps) palm(cx + x, cy + y, s);
    } else {
      const grass = { morning: '#8ee6a4', sunset: '#bfeeb0', night: '#86d9b6' }[th];
      const rim = { morning: '#e8b67e', sunset: '#f3c39a', night: '#c9a3c9' }[th];
      const tcol = th === 'sunset' ? '#ff9ec4' : th === 'night' ? '#4fc49a' : '#3fcf8e';
      blobPath(pts, 90, 76, cx, cy + 9); ol(rim, 3);
      blobPath(pts, 90, 76, cx, cy); ol(grass, 3);
      ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.beginPath(); ctx.ellipse(cx - 34, cy - 38, 20, 8, -.4, 0, TAU); ctx.fill();
      for (let i = 0; i < 8; i++) { ctx.fillStyle = CONFETTI[i % CONFETTI.length]; circ(cx + rand(-56, 56), cy + rand(-44, 44), 2.4); ctx.fill(); }
      if (k === 0 && th !== 'sunset') {
        ctx.beginPath(); ctx.ellipse(cx + 10, cy - 4, 24, 15, .2, 0, TAU); ol('#8fd9ff', 2.4);
        ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(cx + 2, cy - 9, 7, 3, .2, 0, TAU); ctx.fill();
      }
      const houses = th === 'sunset' ? [[-30, -14], [14, -26], [34, 12], [-6, 22]] : k === 0 ? [] : k === 1 ? [[-8, -8]] : [[-28, 6], [22, -14]];
      const trees = k === 0 ? [[-38, -14, 16], [-12, -34, 13], [34, 22, 15], [-4, 32, 12]] : [[36, 28, 13], [-42, 22, 12], [44, -24, 11]];
      houses.forEach(([x, y], i) => {
        roofTop(cx + x, cy + y, 30, 22, ROOFS[(i + k * 2) % ROOFS.length], rand(-.2, .2));
        if (th === 'night') { circ(cx + x + 19, cy + y + 7, 3.4); ol('#fff3a8', 1.6); }
      });
      trees.forEach(([x, y, r]) => treeTop(cx + x, cy + y, r, tcol));
    }
  });
}
function initSprites() {
  SPR.clouds = {}; SPR.isl = {};
  const shapes = [0, 1, 2].map(cloudPuffs);
  SPR.cloudSh = shapes.map(p => makeSprite(300, 170, () => { puffsPath(p, 3); ctx.fillStyle = OUT; ctx.fill(); }));
  for (const th of THEMES) {
    SPR.clouds[th] = shapes.map(p => makeCloud(p, THEME[th].cloud, THEME[th].cshade));
    SPR.isl[th] = [0, 1, 2].map(k => makeIsland(th, k));
  }
  SPR.ready = true;
}
function newIsland(y) { return { x: rand(-40, W + 40), y, s: rand(.7, 1.1), k: Math.random() * 3 | 0, r: rand(-.4, .4) }; }
function initBG() {
  if (!SPR.ready) initSprites();
  bgObj.islands = []; for (let i = 0; i < 5; i++) bgObj.islands.push(newIsland(rand(-120, H)));
  bgObj.cloudsFar = []; for (let i = 0; i < 7; i++) bgObj.cloudsFar.push({ x: rand(-100, W), y: Math.random() * H, s: rand(.6, 1.1), k: i % 3, sp: rand(70, 110) });
  bgObj.cloudsNear = []; for (let i = 0; i < 3; i++) bgObj.cloudsNear.push({ x: rand(-100, W), y: Math.random() * H, s: rand(1.4, 2.1), k: i % 3, sp: rand(260, 340) });
  bgObj.glints = []; for (let i = 0; i < 40; i++) bgObj.glints.push({ x: Math.random() * W, y: Math.random() * H, l: rand(10, 22), ph: Math.random() * TAU, s: rand(.6, 1.2) });
  bgObj.moon = { x: W * .78, y: H * .2 };
}
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  initBG();
}
addEventListener('resize', resize);

let warp = 0, bgPhase = 0;
function updateBG(dt) {
  const speed = 1 + warp;
  bgPhase += dt;
  const gs = 70 * speed * dt;
  bgScroll += gs;
  for (const o of bgObj.islands) { o.y += gs; if (o.y > H + 170) Object.assign(o, newIsland(-170 - Math.random() * 120)); }
  for (const g of bgObj.glints) { g.y += gs * .8; if (g.y > H + 20) { g.y = -20; g.x = Math.random() * W; } }
  for (const c of bgObj.cloudsFar) { c.y += c.sp * speed * dt; if (c.y > H + 150) { c.y = -200; c.x = rand(-150, W); c.s = rand(.6, 1.1); } }
  for (const c of bgObj.cloudsNear) { c.y += c.sp * speed * dt; if (c.y > H + 250) { c.y = -400 - Math.random() * 400; c.x = rand(-200, W); c.s = rand(1.4, 2.1); } }
  const m = bgObj.moon; if (m) { m.y += 10 * speed * dt; if (m.y > H + 80) { m.y = -80; m.x = rand(W * .15, W * .85); } }
}
function drawMoon(x, y) {
  const R = 30;
  circ(x, y, R); ol('#fff3b0', 3);
  ctx.fillStyle = 'rgba(230,200,120,.35)'; circ(x + 12, y - 12, 6); ctx.fill(); circ(x - 15, y - 9, 4); ctx.fill();
}
function drawCloudSet(list, set, alpha, shadow) {
  for (const c of list) {
    const k = c.k % set.length, sp = set[k], w = sp.lw * c.s, h = sp.lh * c.s;
    if (shadow) { ctx.globalAlpha = .1; ctx.drawImage(SPR.cloudSh[k], c.x - w / 2 + 26 * c.s, c.y - h / 2 + 40 * c.s, w, h); }
    ctx.globalAlpha = alpha; ctx.drawImage(sp, c.x - w / 2, c.y - h / 2, w, h);
  }
  ctx.globalAlpha = 1;
}
function drawBG() {
  const th = theme(), TH = THEME[th];
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, TH.sky[0]); g.addColorStop(.6, TH.sky[1]); g.addColorStop(1, TH.sky[2]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (th === 'ocean') {
    // 반짝이는 물결
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
    for (const gl of bgObj.glints) {
      ctx.globalAlpha = .35 + .35 * Math.max(0, Math.sin(bgPhase * 2 + gl.ph));

function updatePlay(dt) {

  hudPanel(W - 172, 10, 160, 84);
  ctx.textAlign = 'right';
  ctx.font = `14px ${FONT}`; ctx.fillStyle = C.mintD; ctx.fillText('최고 기록', W - 26, 32);
  ctx.font = `20px ${FONT}`; ctx.fillStyle = OUT; ctx.fillText(Math.max(hiscore, score).toLocaleString(), W - 26, 56);
  ctx.font = `16px ${FONT}`; ctx.fillStyle = THEME[theme()].accent; ctx.fillText('스테이지 ' + stage, W - 26, 82);
  // 파워 / 폭탄 / 목숨
  const by = H - 126;
  hudPanel(12, by, 176, 114);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.font = `14px ${FONT}`;
  ctx.fillStyle = '#e0503f'; ctx.fillText('파워', 24, by + 21);
  for (let i = 0; i < 5; i++) {
    const on = i < p.power;
    rr(64 + i * 22, by + 13, 18, 16, 6); ol(on ? (p.power === 5 ? `hsl(${(T * 300 + i * 40) % 360},90%,70%)` : C.coral) : '#e8eef0', 2);
  }
  ctx.fillStyle = '#d08a00'; ctx.fillText('폭탄', 24, by + 56);
  for (let i = 0; i < p.bombs; i++) drawBombIcon(72 + i * 19, by + 57, .85);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.font = `14px ${FONT}`;
  ctx.fillStyle = C.mintD; ctx.fillText('목숨', 24, by + 92);
  for (let i = 0; i < p.lives; i++) drawShip(82 + i * 34, by + 92, 0, T, .5);
  // 콤보
  if (combo > 1) {
    const sc = 1 + comboPop * .5, x = W - 30, y = H * .5;
    ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); ctx.rotate(-.06);
    const hue = (200 + combo * 7) % 360, col = `hsl(${hue},90%,68%)`;
    const size = Math.min(60, 34 + combo * .4);
    ctx.font = `${size}px ${FONT}`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.lineWidth = size * .18; ctx.strokeStyle = OUT; ctx.strokeText(combo, 0, 0); ctx.fillStyle = col; ctx.fillText(combo, 0, 0);
    ctx.font = `17px ${FONT}`; ctx.lineWidth = 4; ctx.strokeText('콤보!', 0, size * .55 + 6); ctx.fillStyle = '#ffffff'; ctx.fillText('콤보!', 0, size * .55 + 6);
    const k = clamp(comboT / 2.2, 0, 1), yb = size * .55 + 20;
    rr(-90, yb, 90, 9, 4.5); ol('#ffffff', 2);
    if (k > .03) { rr(-90 * k, yb, 90 * k, 9, 4.5); ctx.fillStyle = col; ctx.fill(); }
    ctx.restore();
  }
  // 보스 체력바
  const boss = enemies.find(e => e.type === 'boss');
  if (boss) {
    boss.hpTrail = lerp(boss.hpTrail, Math.max(0, boss.hp), .04);
    const ap = ease.outCubic(clamp(boss.t / 1.5, 0, 1));
    const bw = Math.min(W * .6, 520) * ap, bx = W / 2 - bw / 2, by2 = 128;
    if (bw > 4) {
      rr(bx - 4, by2 - 4, bw + 8, 22, 11); ol('#ffffff', 3);
      const k1 = clamp(boss.hpTrail / boss.maxHp, 0, 1), k2 = clamp(Math.max(0, boss.hp) / boss.maxHp, 0, 1);
      if (k1 * bw > 2) { rr(bx, by2, bw * k1, 14, 7); ctx.fillStyle = '#ffd9cf'; ctx.fill(); }
      if (k2 * bw > 2) {
        rr(bx, by2, bw * k2, 14, 7); ctx.fillStyle = boss.hp < boss.maxHp * .5 ? '#ff5a6e' : '#ff8a96'; ctx.fill();
        if (bw * k2 > 10) { rr(bx + 4, by2 + 2, bw * k2 - 8, 4, 2); ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fill(); }
      }
      ctx.globalAlpha = ap; cartoonText('폭주 복합기' + (stage > 1 ? '  Lv.' + stage : ''), W / 2, by2 - 14, 18, '#ff8a96', OUT, 4); ctx.globalAlpha = 1;
    }
  }
  // 터치 폭탄 버튼
  if (isTouch) {
    const x = W - 64, y = H - 74, rdy = p.bombs > 0, pul = rdy ? 1 + Math.sin(T * 4) * .04 : 1;
    ctx.save(); ctx.translate(x, y); ctx.scale(pul, pul);
    circ(0, 0, 34); ol(rdy ? '#ffffff' : 'rgba(255,255,255,.6)', 3.5);
    circ(0, 0, 26); ol(rdy ? C.gold : '#e8eef0', 2.5);
    cartoonText('폭탄', 0, 1, 16, rdy ? '#ffffff' : '#c8d2d4', OUT, 4);
    ctx.restore();
  }
  if (muted) { ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic'; ctx.font = `13px ${FONT}`; ctx.fillStyle = OUT; ctx.fillText('음소거', W - 22, 112); }
}

function drawTitle() {
  // 데모 기체
  const sy = H * .64 + Math.sin(T * 2) * 10;
  shipShadow(W / 2, sy, 1.6);
  drawShip(W / 2, sy, Math.sin(T * 1.3) * .6, T, 1.6);
  const size = Math.min(100, W / 5.2);
  drawLetters('SKY', H * .14, size, T, false, C.mint);
  drawLetters('BLAZE', H * .14 + size * .92, size, T - .25, false, C.gold);
  ctx.globalAlpha = clamp((T - .8) / .5, 0, 1);
  cartoonText('뭉게뭉게 하늘 슈팅 대모험!', W / 2, H * .14 + size * 1.62, Math.min(20, W / 20), '#ffffff', OUT, 4);
  // 시작 버튼
  const by = H * .82, pulse = 1 + Math.sin(T * 5) * .04;
  ctx.save(); ctx.translate(W / 2, by); ctx.scale(pulse, pulse);
  const bw = Math.min(W - 40, 320);
  rr(-bw / 2, -22, bw, 44, 22); ol(C.mint, 3.5);
  cartoonText(isTouch ? '탭해서 출격!' : 'SPACE 로 출격!', 0, 0, Math.min(22, W / 18), '#ffffff', OUT, 4);
  ctx.restore();
  ctx.font = `${Math.min(13, W / 32)}px ${FONT}`; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  const lines = isTouch ? ['드래그로 이동 · 자동 발사 · 오른쪽 아래 버튼으로 폭탄']
    : ['이동: 방향키 / WASD / 마우스 드래그  ·  자동 발사  ·  폭탄: X', '정밀 이동: Shift  ·  일시정지: P  ·  음소거: M'];
  lines.forEach((l, i) => { ctx.lineWidth = 4; ctx.strokeStyle = OUT; ctx.strokeText(l, W / 2, by + 40 + i * 20); ctx.fillText(l, W / 2, by + 40 + i * 20); });
  if (hiscore > 0) cartoonText('최고 기록  ' + hiscore.toLocaleString(), W / 2, by + 48 + lines.length * 20, 15, C.gold);
  ctx.globalAlpha = 1;
}

function drawGameOver() {
  const a = clamp(overT / .8, 0, 1);
  ctx.fillStyle = `rgba(29,50,54,${.45 * a})`; ctx.fillRect(0, 0, W, H);
  drawLetters('게임 오버', H * .17, Math.min(84, W / 6), overT, true, '#ff8a6a');
  const pk = ease.outBack(clamp((overT - .7) / .5, 0, 1));
  const pw = Math.min(400, W - 40), ph = 236, px = W / 2 - pw / 2, py = H * .29;
  if (pk > 0) { ctx.save(); ctx.translate(W / 2, py + ph / 2); ctx.scale(pk, pk); ctx.translate(-W / 2, -(py + ph / 2)); rr(px, py, pw, ph, 24); ol('#ffffff', 4); ctx.restore(); }
  const rows = [['점수', Math.round(score * ease.outCubic(clamp((overT - .9) / 1.2, 0, 1))).toLocaleString(), OUT],
    ['스테이지', stage, C.mintD], ['최대 콤보', maxCombo, '#ff6b8a'], ['격추', kills, C.orange], ['스치기', grazes, '#3f97d8']];
  rows.forEach((r, i) => {
    const k = ease.outCubic(clamp((overT - .9 - i * .12) / .4, 0, 1)), y = py + 36 + i * 41;
    ctx.globalAlpha = k; ctx.textBaseline = 'middle';
    ctx.font = `16px ${FONT}`; ctx.textAlign = 'right'; ctx.fillStyle = '#6b8a8f'; ctx.fillText(r[0], W / 2 - 16 - (1 - k) * 60, y);
    ctx.font = `${i === 0 ? 28 : 22}px ${FONT}`; ctx.textAlign = 'left'; ctx.fillStyle = r[2]; ctx.fillText(r[1], W / 2 + 16 + (1 - k) * 60, y);
  });
  ctx.globalAlpha = 1;
  if (newRecord && overT > 2) {
    const s = 1 + Math.sin(T * 8) * .08, ry = py + ph + 30;
    ctx.save(); ctx.translate(W / 2, ry); ctx.scale(s, s); ctx.rotate(-.04);
    cartoonText('★ 신기록 달성! ★', 0, 0, 26, C.gold); ctx.restore();
    if (Math.random() < .3) spark(W / 2 + rand(-150, 150), ry + rand(-20, 20), -Math.PI / 2 + rand(-.5, .5), 60, CONFETTI[Math.random() * CONFETTI.length | 0], .6, 3);
  }
  if (overT > 1.5) { ctx.globalAlpha = .6 + .4 * Math.sin(T * 5); cartoonText(isTouch ? '탭해서 재출격' : 'SPACE 로 재출격', W / 2, H * .9, 22, '#ffffff'); ctx.globalAlpha = 1; }
}

function inMenuBtn(x, y) { return Math.abs(x - W / 2) < 52 && y > 8 && y < 46; }
function drawMenuBtn() {
  rr(W / 2 - 52, 10, 104, 34, 17); ol('#ffffff', 3);
  ctx.font = `14px ${FONT}`; ctx.fillStyle = OUT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('◀ 메뉴 (Esc)', W / 2, 28);
}

function scribble(x, y, w, n, gap = 5, col = 'rgba(29,50,54,.35)') {
  ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) { const ww = w * (i === n - 1 ? .6 : .9 + (i % 2) * .1); ctx.beginPath(); ctx.moveTo(x, y + i * gap); ctx.lineTo(x + ww, y + i * gap); ctx.stroke(); }
}
function stampMark(x, y, text, size = 8, col = '#ff4d5e', rot = -.25) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.font = `${size}px ${FONT}`; const w = ctx.measureText(text).width + size * .8;
  ctx.strokeStyle = col; ctx.lineWidth = 1.6; rr(-w / 2, -size * .75, w, size * 1.5, 3); ctx.stroke();
  ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, .5);
  ctx.restore();
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (W < 1 || H < 1 || !SPR.ready) return;
  ctx.save();
  if (shake > .3) { ctx.translate(rand(-1, 1) * shake, rand(-1, 1) * shake); }
  drawBG();
  if (state !== 'title') {
    for (const it of pickups) drawPickup(it);
    for (const e of enemies) drawEnemy(e);
    drawBullets();
    drawPlayer();
    drawFG();
  }
  drawParticles();
  drawBombWave();
  drawTexts();
  ctx.restore();
  if (state === 'title') drawTitle();
  else {
    drawBanner();
    drawHUD();
    if (state === 'over') drawGameOver();
  }
  if (flash > 0) { ctx.fillStyle = `rgba(${flashColor},${flash * .7})`; ctx.fillRect(0, 0, W, H); }
  if (state !== 'play') drawMenuBtn();
  if (paused && state === 'play') {
    ctx.fillStyle = 'rgba(29,50,54,.5)'; ctx.fillRect(0, 0, W, H);
    cartoonText('잠깐 쉬는 중', W / 2, H / 2, Math.min(64, W / 8), '#ffffff');
    cartoonText(isTouch ? '탭해서 계속' : 'P 를 눌러 계속', W / 2, H / 2 + 56, 18, C.mintL);
  }
}

// ---------- 메인 루프 ----------
let last = performance.now();
function frame(now) {
  const rdt = Math.min(.05, (now - last) / 1000); last = now;
  update(rdt);
  draw();
  requestAnimationFrame(frame);
}
resize();
player = { x: W / 2, y: H * .8, tilt: 0, lives: 3, bombs: 3, power: 1, dead: true, inv: 0, enterT: 1 };
requestAnimationFrame(frame);
</script>
</body>
</html>
