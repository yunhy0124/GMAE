<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Arcade</title>
<style>
  :root{--bg:#06020f;--ink:#ffffff;--muted:#b9b0d8;--pink:#ff3df0;--cyan:#2bd9ff;--gold:#ffd23f}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;overflow-x:hidden}
  #bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0}
  main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px 56px}
  h1{margin:0 0 6px;font-size:clamp(32px,10.5vw,110px);font-weight:900;font-style:italic;letter-spacing:.02em;line-height:1;text-align:center;white-space:nowrap}
  h1 span{display:inline-block;color:#fff;text-shadow:-4px 0 rgba(255,40,200,.85),4px 0 rgba(40,220,255,.85),0 0 30px rgba(255,61,240,.6);
    animation:drop .8s cubic-bezier(.2,1.6,.4,1) both, bob 2.4s ease-in-out infinite}
  h1 .sp{width:.35em}
  @keyframes drop{from{transform:translateY(-120px) scale(.2);opacity:0}to{transform:none;opacity:1}}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -8px}}
  .sub{color:var(--cyan);letter-spacing:.5em;font-weight:700;font-size:clamp(11px,1.6vw,15px);margin:6px 0 42px;text-align:center;opacity:0;animation:fade .6s .9s forwards;padding-left:.5em}
  @keyframes fade{to{opacity:1}}
  [hidden]{display:none!important}
  /* 넓은 화면 4개 한 줄 → 중간 2×2 → 폰 1열 */
  .cards{display:grid;grid-template-columns:repeat(4,minmax(0,290px));gap:22px;perspective:1100px;width:100%;justify-content:center}
  @media (max-width:1180px){
    .cards{grid-template-columns:repeat(2,minmax(0,360px))}
  }
  @media (max-width:720px){
    .cards{grid-template-columns:minmax(0,420px)}
  }
  .card{position:relative;border-radius:20px;padding:2px;cursor:pointer;outline:none;transform-style:preserve-3d;
    transition:transform .25s ease, filter .3s ease, opacity .3s;opacity:0;animation:rise .7s cubic-bezier(.2,1.3,.4,1) forwards;animation-delay:calc(1s + var(--i)*.14s)}
  @keyframes rise{from{opacity:0;transform:translateY(80px) rotateX(30deg)}to{opacity:1;transform:none}}
  .card::before{content:"";position:absolute;inset:0;border-radius:20px;padding:2px;background:conic-gradient(from var(--a,0deg),var(--c1),transparent 30%,var(--c2) 50%,transparent 80%,var(--c1));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.35;transition:opacity .3s}
  .card.sel::before{opacity:1;animation:spin 2.2s linear infinite}
  @property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
  @keyframes spin{to{--a:360deg}}
  .card .in{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,rgba(30,14,60,.92),rgba(10,4,24,.95));height:100%;display:flex;flex-direction:column}
  .card.sel{filter:drop-shadow(0 0 28px var(--c1))}
  .cards.has-sel .card:not(.sel){filter:brightness(.62) saturate(.8)}
  .card canvas{display:block;width:100%;aspect-ratio:16/10;background:#05020c}
  .card .info{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
  .tag{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.18em;padding:4px 10px;border-radius:99px;color:#0a0418;background:var(--c1)}
  .card h2{margin:4px 0 0;font-size:26px;font-weight:900;font-style:italic;letter-spacing:.02em;text-shadow:0 0 18px var(--c1)}
  .card p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.55}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px}
  .best{font:700 12px Consolas,monospace;color:var(--muted);letter-spacing:.08em}
  .best b{color:#fff;font-size:15px}
  .play{font-weight:900;font-size:14px;letter-spacing:.12em;padding:8px 16px;border-radius:10px;border:0;color:#0a0418;background:linear-gradient(90deg,var(--c1),var(--c2));cursor:pointer;
    box-shadow:0 0 18px var(--c1);transition:transform .15s}
  .card.sel .play{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.08)}}
  .shine{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.18),transparent 45%);opacity:0;transition:opacity .3s}
  .card.sel .shine{opacity:1}
  .hint{margin-top:34px;color:rgba(255,255,255,.55);font-size:13px;text-align:center;opacity:0;animation:fade .6s 1.8s forwards}
  .hint kbd{font:700 11px Consolas,monospace;border:1px solid rgba(255,255,255,.35);border-bottom-width:2px;border-radius:5px;padding:1px 6px;margin:0 2px;color:#fff}
  #flash{position:fixed;inset:0;z-index:25;pointer-events:none;background:#fff;opacity:0}
  .best.free{color:#ffc2ec}
  /* ---------- 닉네임 바 ---------- */
  .nickbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 10px;margin:-24px 0 30px;padding:8px 8px 8px 18px;border-radius:99px;max-width:100%;
    background:rgba(24,10,52,.55);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 0 24px rgba(43,217,255,.12);opacity:0;animation:fade .6s 1s forwards}
  .nb-label{font:800 11px Consolas,monospace;letter-spacing:.2em;color:var(--cyan)}
  .nb-nick{font-weight:900;font-style:italic;font-size:17px;max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 0 12px rgba(255,61,240,.7)}
  .nb-nick.empty{color:var(--muted);font-style:normal;font-weight:600;font-size:14px;text-shadow:none}
  .btn{font:800 12.5px "Segoe UI",system-ui,sans-serif;letter-spacing:.06em;padding:7px 13px;border-radius:99px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;transition:background .2s,transform .15s,box-shadow .2s}
  .btn:hover,.btn:focus-visible{background:rgba(255,255,255,.14);outline:none;box-shadow:0 0 14px rgba(43,217,255,.4)}
  .btn.hot{border:0;color:#0a0418;background:linear-gradient(90deg,var(--gold),var(--pink));box-shadow:0 0 16px rgba(255,61,240,.5)}
  .nickform{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
  .nickform input{width:min(200px,52vw);font:700 15px "Segoe UI",system-ui,sans-serif;color:#fff;padding:7px 14px;border-radius:99px;border:1px solid rgba(43,217,255,.6);
    background:rgba(5,2,14,.7);outline:none;box-shadow:0 0 0 0 rgba(43,217,255,0);transition:box-shadow .2s}
  .nickform input:focus{box-shadow:0 0 0 3px rgba(43,217,255,.25),0 0 18px rgba(43,217,255,.4)}
  .nb-err{flex-basis:100%;text-align:center;font-size:12px;color:#ff8fb1;min-height:0}
  .nb-err:empty{display:none}
  .nickbar.ask{animation:fade .01s forwards,askpulse 1.2s ease-in-out 3}
  @keyframes askpulse{50%{box-shadow:0 0 0 4px rgba(255,210,63,.35),0 0 30px rgba(255,61,240,.5)}}
  .nb-msg{flex-basis:100%;text-align:center;font-size:12.5px;color:var(--gold)}
  /* ---------- 랭킹 ---------- */
  .rank{width:100%;max-width:640px;margin-top:40px;border-radius:22px;padding:18px 18px 14px;
    background:linear-gradient(160deg,rgba(44,18,88,.55),rgba(10,4,24,.72));border:1px solid rgba(255,255,255,.13);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 40px rgba(255,61,240,.12),inset 0 1px 0 rgba(255,255,255,.08);
    opacity:0;animation:fade .6s 1.9s forwards;scroll-margin-top:20px}
  .rank header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .rank h3{margin:0;font-size:22px;font-weight:900;font-style:italic;letter-spacing:.04em;text-shadow:0 0 16px rgba(255,210,63,.6)}
  .mode{font:800 10.5px Consolas,monospace;letter-spacing:.14em;padding:4px 10px;border-radius:99px;border:1px solid currentColor;color:var(--cyan);white-space:nowrap}
  .mode.local{color:var(--gold)}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .tab{flex:1 1 auto;min-width:0;font:800 12px "Segoe UI",system-ui,sans-serif;letter-spacing:.06em;padding:8px 10px;border-radius:12px;cursor:pointer;
    color:var(--muted);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);transition:color .2s,background .2s,box-shadow .2s}
  .tab:hover{color:#fff}
  .tab[aria-selected="true"]{color:#0a0418;background:linear-gradient(90deg,var(--c1),var(--c2));border-color:transparent;box-shadow:0 0 16px var(--c1)}
  .list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;min-height:120px}
  .list li{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 12px;border-radius:12px;background:rgba(255,255,255,.035);
    animation:rowin .35s ease both;animation-delay:calc(var(--k,0)*.025s)}
  @keyframes rowin{from{opacity:0;transform:translateX(-10px)}}
  .list .pos{font:900 15px Consolas,monospace;color:var(--muted);text-align:center}
  .list .medal{font-size:20px;line-height:1}
  .list .nm{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list .sc{font:800 15px Consolas,monospace;letter-spacing:.04em}
  .list li.top1{background:linear-gradient(90deg,rgba(255,210,63,.18),rgba(255,255,255,.03))}
  .list li.me{background:linear-gradient(90deg,rgba(43,217,255,.28),rgba(255,61,240,.16));box-shadow:inset 0 0 0 1px rgba(43,217,255,.7),0 0 16px rgba(43,217,255,.25)}
  .list li.me .nm::after{content:" (나)";color:var(--cyan);font-size:12px}
  .list li.flash{animation:rowin .35s ease both,mefl 1s ease 2}
  @keyframes mefl{50%{box-shadow:inset 0 0 0 2px #fff,0 0 30px rgba(255,210,63,.7)}}
  .list .empty{display:block;text-align:center;color:var(--muted);font-size:13.5px;padding:26px 8px;background:none}
  .note{margin:10px 2px 0;font-size:12px;color:var(--muted);line-height:1.5}
  .note:empty{display:none}
  .note.warn{color:#ffb38f}
  .spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:var(--cyan);vertical-align:-2px;margin-right:8px;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* ---------- 게임 오버레이 ---------- */
  #game{position:fixed;inset:0;z-index:20;background:#000}
  #game iframe{display:block;width:100%;height:100%;border:0}
  /* ---------- 토스트 ---------- */
  #toast{position:fixed;left:50%;top:22px;z-index:30;pointer-events:none;transform:translate(-50%,-30px) scale(.8);opacity:0;
    padding:12px 22px;border-radius:16px;text-align:center;color:#0a0418;font-weight:900;font-style:italic;letter-spacing:.06em;max-width:calc(100vw - 32px);
    background:linear-gradient(90deg,var(--gold),var(--pink));box-shadow:0 0 30px rgba(255,61,240,.7),0 0 0 2px rgba(255,255,255,.5)}
  #toast.show{animation:toast 2.6s cubic-bezier(.2,1.4,.4,1) forwards}
  #toast b{display:block;font-size:24px;line-height:1.1}
  #toast span{font:800 13px Consolas,monospace;font-style:normal}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,-30px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.06)}20%,85%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-20px) scale(.95)}}
  @media (max-width:520px){
    .nickbar{border-radius:20px;padding:10px 12px}
    .rank{padding:14px 12px 12px;border-radius:18px}
    .tab{font-size:11px;padding:7px 6px;flex-basis:calc(50% - 3px)}
    .list li{grid-template-columns:34px minmax(0,1fr) auto;gap:8px;padding:7px 9px}
  }
  .card.launch{z-index:4;transition:transform .5s cubic-bezier(.6,-0.2,.7,1),opacity .5s;transform:scale(1.6) translateZ(100px)!important;opacity:0}
  @media (prefers-reduced-motion:reduce){h1 span,.card,.sub,.hint,.nickbar,.rank,.list li{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<main>
  <h1 id="title"></h1>
  <div class="sub">CHOOSE YOUR GAME</div>
  <div class="nickbar" id="nickbar">
    <div class="nickform" id="nickView">
      <span class="nb-label">PLAYER</span>
      <span class="nb-nick empty" id="nickShow">닉네임 없음</span>
      <button class="btn" id="nickEdit" type="button">✎ 닉네임</button>
      <button class="btn hot" id="rankBtn" type="button">🏆 랭킹</button>
    </div>
    <form class="nickform" id="nickForm" hidden autocomplete="off">
      <span class="nb-label">NICKNAME</span>
      <input id="nickInput" maxlength="24" placeholder="닉네임 (2–12자)" aria-label="닉네임" spellcheck="false">
      <button class="btn hot" type="submit">저장</button>
      <button class="btn" type="button" id="nickCancel">취소</button>
      <span class="nb-err" id="nickErr" role="alert"></span>
    </form>
  </div>
  <div class="cards" id="cards"></div>
  <div class="hint"><kbd>←</kbd><kbd>→</kbd> 선택 · <kbd>Enter</kbd> 시작 · <kbd>1</kbd>–<kbd>5</kbd> 바로 시작 · 게임 중 <kbd>Esc</kbd> 로 메뉴 복귀</div>
  <section class="rank" id="rank" aria-labelledby="rankTitle">
    <header><h3 id="rankTitle">🏆 랭킹</h3><span class="mode local" id="rankMode">로컬 기록</span></header>
    <div class="tabs" id="rankTabs" role="tablist"></div>
    <ol class="list" id="rankList"></ol>
    <p class="note" id="rankNote"></p>
  </section>
</main>
<div id="game" hidden><iframe id="gameFrame" name="arcade-game" title="게임" allow="autoplay; fullscreen"></iframe></div>
<div id="flash"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
// 게임이 예전 방식으로 index.html 로 되돌아와 오버레이 iframe 안에 런처가 뜬 경우: 부모에게 메뉴 복귀를 알리고 아무것도 그리지 않음
const EMBEDDED = window.name === 'arcade-game' && window.parent !== window;
if (EMBEDDED) { document.documentElement.style.visibility = 'hidden'; try { window.parent.postMessage({ type: 'menu' }, '*'); } catch (e) { } }
const GAMES = [
  { id: 'sky', href: 'skyblaze.html', name: 'SKY BLAZE', tag: 'SHOOTER', c1: '#2bd9ff', c2: '#ff3d7f', key: 'skyblaze_hi',
    desc: '전투기를 몰고 적 편대와 초대형 전함을 격추하라. 파워업, 유도 미사일, 폭탄, 탄막 보스전!' },
  { id: 'brk', href: 'breaker.html', name: 'NEON BREAKER', tag: 'ARCADE', c1: '#ff3df0', c2: '#7b2ff7', key: 'neonbreaker_hi',
    desc: '공을 튕겨 네온 벽돌을 부숴라. 연쇄 폭발 벽돌, 멀티볼, 레이저, 파이어볼까지!' },
  { id: 'run', href: 'runner.html', name: 'NEON DASH', tag: 'RUNNER', c1: '#ffd23f', c2: '#ff3df0', key: 'neondash_hi',
    desc: '네온 도시를 질주하라! 점프·2단 점프·슬라이드로 장애물을 피하고 드론을 밟아라.' },
  { id: 'stk', href: 'stack.html', name: 'NEON STACK', tag: 'PUZZLE', c1: '#3bff9d', c2: '#2bd9ff', key: 'neonstack_hi',
    desc: '떨어지는 블록을 쌓아 줄을 지워라. 4줄 동시 클리어, 콤보, 그리고 게이지를 모아 NOVA 블래스트!' },
];
const RANKED = GAMES.filter(g => !g.unranked);
const TAU = Math.PI * 2, rand = (a, b) => a + Math.random() * (b - a);

// ---------- 타이틀 글자 ----------
const title = document.getElementById('title');
[...'NEON ARCADE'].forEach((c, i) => {
  const s = document.createElement('span');
  if (c === ' ') { s.className = 'sp'; s.innerHTML = '&nbsp;'; }
  else s.textContent = c;
  s.style.animationDelay = `${i * .06}s, ${.8 + i * .12}s`;
  title.appendChild(s);
});

// ---------- 카드 ----------
const wrap = document.getElementById('cards');
let sel = -1, launching = false;
const previews = [];
GAMES.forEach((g, i) => {
  const el = document.createElement('div');
  el.className = 'card'; el.tabIndex = 0;
  el.style.setProperty('--i', i); el.style.setProperty('--c1', g.c1); el.style.setProperty('--c2', g.c2);
  const bestHTML = g.unranked ? `<span class="best free">FREE PLAY ♡</span>` : `<span class="best">BEST <b>0</b></span>`;
  el.innerHTML = `<div class="in"><canvas></canvas><div class="info">
      <span class="tag">${g.tag}</span><h2>${g.name}</h2><p>${g.desc}</p>
      <div class="row">${bestHTML}<button class="play" tabindex="-1">PLAY ▶</button></div>
    </div><div class="shine"></div></div>`;
  el.addEventListener('mouseenter', () => select(i));
  el.addEventListener('focus', () => select(i));
  el.addEventListener('mousemove', e => {
    const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    if (!el.classList.contains('launch')) el.style.transform = `rotateY(${(x - .5) * 16}deg) rotateX(${(.5 - y) * 12}deg) translateZ(20px) scale(1.03)`;
    el.style.setProperty('--mx', x * 100 + '%'); el.style.setProperty('--my', y * 100 + '%');
  });
  el.addEventListener('mouseleave', () => { el.style.transform = ''; });
  el.addEventListener('click', () => launch(i));
  wrap.appendChild(el);
  const cv = el.querySelector('canvas');
  previews.push({ el, cv, ctx: cv.getContext('2d'), game: g, st: null });
});
function select(i) {
  sel = i; wrap.classList.add('has-sel');
  previews.forEach((p, k) => p.el.classList.toggle('sel', k === i));
  blip(500 + i * 120);
}
// ---------- 게임 오버레이 ----------
const gameBox = document.getElementById('game'), gameFrame = document.getElementById('gameFrame'), flashEl = document.getElementById('flash');
let gameOpen = null, launchTimer = 0; // gameOpen: 실행 중인 GAMES 항목
function launch(i) {
  if (launching || gameOpen) return;
  if (!getNick()) { askNick(i); return; }
  launching = true;
  select(i);
  const p = previews[i];
  p.el.classList.add('launch');
  flashEl.getAnimations().forEach(a => a.cancel());
  flashEl.animate([{ opacity: 0 }, { opacity: .95 }, { opacity: 1 }], { duration: 520, easing: 'ease-in', fill: 'forwards' });
  warp = 6; whoosh();
  gameFrame.src = p.game.href; // 플래시 동안 미리 로드
  launchTimer = setTimeout(() => {
    gameOpen = p.game; lastGame = p.game.id;
    gameBox.hidden = false;
    document.body.style.overflow = 'hidden';
    try { gameFrame.focus(); gameFrame.contentWindow.focus(); } catch (e) { }
    flashEl.getAnimations().forEach(a => a.cancel());
    flashEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 380, easing: 'ease-out', fill: 'forwards' });
  }, 520);
}
gameFrame.addEventListener('load', () => { if (gameOpen) try { gameFrame.contentWindow.focus(); } catch (e) { } });
function closeGame() {
  if (!gameOpen && !launching) return;
  clearTimeout(launchTimer);
  const was = gameOpen; gameOpen = null; launching = false;
  gameBox.hidden = true;
  gameFrame.src = 'about:blank'; // 게임 루프·오디오 정지
  document.body.style.overflow = '';
  previews.forEach(p => { p.el.classList.remove('launch'); p.el.style.transform = ''; });
  flashEl.getAnimations().forEach(a => a.cancel());
  flashEl.animate([{ opacity: .85 }, { opacity: 0 }], { duration: 420, easing: 'ease-out', fill: 'forwards' });
  warp = 3; last = performance.now();
  refreshCardBests();
  if (was && !was.unranked) setTab(was.id);
  const k = GAMES.indexOf(was); if (k >= 0) { select(k); previews[k].el.focus({ preventScroll: true }); }
}
// 게임 → 런처 메시지. 오버레이 iframe 에서 온 것만 받음
addEventListener('message', e => {
  if (!e.source || e.source !== gameFrame.contentWindow) return;
  onGameMessage(e.data);
});
const SCORE_IDS = new Set(['sky', 'brk', 'run', 'stk']);
function onGameMessage(d) {
  if (!d || typeof d !== 'object' || typeof d.type !== 'string') return;
  if (d.type === 'menu') closeGame();
  else if (d.type === 'score') {
    if (typeof d.game !== 'string' || !SCORE_IDS.has(d.game)) return;
    const s = typeof d.score === 'number' ? d.score : NaN;
    if (!Number.isFinite(s) || s <= 0) return;
    recordScore(d.game, Math.min(1e10, Math.floor(s)));
  }
}
addEventListener('keydown', e => {

    c.fillStyle = 'rgba(255,255,255,.45)'; c.beginPath(); c.ellipse(-4, 14, 2, 4, -.3, 0, TAU); c.fill();
    c.fillStyle = lt; c.beginPath(); c.moveTo(0, 27.5); c.lineTo(-5, 24); c.lineTo(-5, 31); c.closePath(); c.moveTo(0, 27.5); c.lineTo(5, 24); c.lineTo(5, 31); c.closePath(); c.fill();
    c.restore();
  }
  // 반짝이
  c.globalCompositeOperation = 'lighter';
  for (const s of st.sp) {
    s.t += dt; if (s.t > 2) { s.t = 0; s.x = Math.random() * w; s.y = Math.random() * h * .85; }
    const a = Math.sin(s.t / 2 * Math.PI);
    sparkle(c, s.x, s.y, s.s * a, '#fff4fd', a * .9);
    glowDot(c, s.x, s.y, s.s * 2.2, '#ff8fd8', a * .4);
  }
  c.globalCompositeOperation = 'source-over';
  // 통통 튀는 코인
  const cx = w * .86, bounce = Math.abs(Math.sin(T * 3.2)), cy = fy - 10 - bounce * h * .22;
  const sx = Math.cos(T * 6), squash = bounce < .08 ? 1.25 : 1;
  if (bounce < .04 && (st.coinT -= dt) <= 0) { st.coinT = .3; for (let i = 0; i < 5; i++) st.parts.push({ x: cx, y: fy, vx: rand(-70, 70), vy: rand(-90, -20), life: .35, col: '#ffe27a' }); }
  c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(cx, fy + 2, 9 * (1 - bounce * .5), 2.5, 0, 0, TAU); c.fill();
  c.globalCompositeOperation = 'lighter'; glowDot(c, cx, cy, 20, '#ffd23f', .55); c.globalCompositeOperation = 'source-over';
  c.save(); c.translate(cx, cy); c.scale(Math.max(.12, Math.abs(sx)) * squash, 1 / squash);
  c.fillStyle = '#e8a91e'; c.beginPath(); c.arc(0, 0, 9, 0, TAU); c.fill();
  c.fillStyle = '#ffd23f'; c.beginPath(); c.arc(0, 0, 7.2, 0, TAU); c.fill();
  c.fillStyle = sx > 0 ? '#fff3b8' : '#e8a91e'; c.font = '900 9px "Segoe UI",sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('♥', 0, .5);
  c.restore();
  stepParts(c, st, dt);
}
const DRAW = { sky: drawSkyPreview, brk: drawBreakerPreview, run: drawRunnerPreview, stk: drawStackPreview, dress: drawDressPreview };

let last = performance.now();
function frame(now) {
  if (EMBEDDED) return;
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  if (gameOpen) return; // 게임 중에는 런처 렌더링 정지
  drawBG(dt);
  for (const p of previews) { sizePreview(p); if (p.w > 1) DRAW[p.game.id](p, dt); }
}
requestAnimationFrame(frame);
</script>
