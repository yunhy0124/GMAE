<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iM PRO ARCADE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap">
<style>
  /* 레이아웃: 상단 바 → 민트 히어로 → 게임 카드 4열 → 랭킹 카드. 밝은 금융 사이트 톤, 단일 라이트 테마 */
  :root{--mint:#00c4a0;--mint-d:#00977c;--mint-l:#e3f8f2;--mint-xl:#f3fcf9;--navy:#0f2a33;--ink:#0f2a33;--gray:#5d7880;--line:#d6ece6;--card:#ffffff;--warm:#ffb547;--bg:#f3fbf8;
    --muted:#5d7880;--cyan:#00b3c4;--gold:#ffb547;--pink:#00c4a0;
    --f-display:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;--f-num:"Roboto Mono",Consolas,monospace;color-scheme:light}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-display);overflow-x:hidden}
  #bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0}
  [hidden]{display:none!important}
  .topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
    background:rgba(255,255,255,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;letter-spacing:.01em;color:var(--navy);text-decoration:none}
  .logo-mark{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 7px;border-radius:10px;background:var(--mint);color:#fff;font-size:16px;font-weight:900;letter-spacing:0}
  .topinfo{font-size:13px;color:var(--gray);font-weight:700;white-space:nowrap}
  .topinfo b{color:var(--mint-d)}
  main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hero{width:100%;max-width:1240px;margin-top:22px;border-radius:28px;padding:44px 24px 36px;text-align:center;color:#fff;position:relative;overflow:hidden;
    background:linear-gradient(120deg,#00b796 0%,#16cfae 45%,#5fe3c9 100%);box-shadow:0 18px 40px -18px rgba(0,151,124,.55)}
  .hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14);pointer-events:none}
  .hero::before{width:360px;height:360px;right:-90px;top:-150px}
  .hero::after{width:220px;height:220px;left:-60px;bottom:-120px}
  .eyebrow{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.18em;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.2);margin-bottom:14px}
  h1{margin:0;font-size:clamp(30px,7vw,64px);font-weight:900;letter-spacing:-.01em;line-height:1.1;text-wrap:balance}
  h1 span{display:inline-block;animation:drop .7s cubic-bezier(.2,1.4,.4,1) both}
  h1 .m{margin-right:.04em}
  h1 .sp{width:.3em}
  @keyframes drop{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  .sub{margin:12px 0 22px;font-size:clamp(14px,1.8vw,17px);font-weight:500;opacity:.95}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .cards{display:grid;grid-template-columns:repeat(4,minmax(0,290px));gap:20px;width:100%;justify-content:center;margin-top:30px;perspective:1100px}
  @media (max-width:1240px){.cards{grid-template-columns:repeat(2,minmax(0,380px))}}
  @media (max-width:720px){.cards{grid-template-columns:minmax(0,440px)}}
  .card{position:relative;border-radius:22px;cursor:pointer;outline:none;transition:transform .25s ease,box-shadow .25s ease;animation:rise .6s cubic-bezier(.2,1.2,.4,1) both;animation-delay:calc(.2s + var(--i)*.08s)}
  @keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
  .card .in{position:relative;border-radius:22px;overflow:hidden;background:var(--card);height:100%;display:flex;flex-direction:column;border:1px solid var(--line);
    box-shadow:0 8px 24px -14px rgba(15,42,51,.35);transition:border-color .2s,box-shadow .2s}
  .card.sel .in,.card:focus-visible .in{border-color:var(--mint);box-shadow:0 18px 36px -16px rgba(0,151,124,.55),0 0 0 3px rgba(0,196,160,.18)}
  .card.sel{transform:translateY(-6px)}
  .card canvas{display:block;width:100%;aspect-ratio:16/10;max-width:100%;background:#d9f6ff}
  .card .info{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
  .tag{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.14em;padding:4px 10px;border-radius:99px;color:var(--mint-d);background:var(--mint-l)}
  .card h2{margin:2px 0 0;font-size:22px;font-weight:900;color:var(--navy);letter-spacing:-.01em}
  .card p{margin:0;color:var(--gray);font-size:13.5px;line-height:1.6}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:12px;border-top:1px dashed var(--line)}
  .best{font:700 12px var(--f-num);color:var(--gray);letter-spacing:.06em}
  .best b{color:var(--navy);font-size:15px;font-variant-numeric:tabular-nums}
  .play{font:800 13.5px var(--f-display);letter-spacing:.04em;padding:9px 16px;border-radius:12px;border:0;color:#fff;background:var(--mint);cursor:pointer;transition:background .2s,transform .15s}
  .card.sel .play,.play:hover{background:var(--mint-d)}
  .shine{display:none}
  .hint{margin-top:26px;color:var(--gray);font-size:13px;text-align:center;line-height:2}
  .hint kbd{font:700 11px var(--f-num);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 7px;margin:0 2px;color:var(--navy);background:#fff}
  #flash{position:fixed;inset:0;z-index:25;pointer-events:none;background:#fff;opacity:0}
  .best.free{color:var(--mint-d)}
  /* 닉네임 */
  .nickbar{display:inline-flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 10px;padding:8px 8px 8px 18px;border-radius:99px;max-width:100%;position:relative;z-index:1;
    background:#fff;color:var(--navy);box-shadow:0 10px 24px -12px rgba(15,42,51,.45)}
  .nb-label{font:800 11px var(--f-num);letter-spacing:.18em;color:var(--mint-d)}
  .nb-nick{font-weight:900;font-size:17px;max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--navy)}
  .nb-nick.empty{color:var(--gray);font-weight:600;font-size:14px}
  .btn{font:800 12.5px var(--f-display);letter-spacing:.02em;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--mint-xl);color:var(--navy);cursor:pointer;transition:background .2s,border-color .2s}
  .btn:hover,.btn:focus-visible{background:var(--mint-l);border-color:var(--mint);outline:none}
  .btn.hot{border:0;color:#fff;background:var(--mint)}
  .btn.hot:hover,.btn.hot:focus-visible{background:var(--mint-d)}
  .nickform{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
  .nickform input{width:min(200px,52vw);font:700 15px var(--f-display);color:var(--navy);padding:8px 14px;border-radius:99px;border:1.5px solid var(--mint);background:#fff;outline:none}
  .nickform input:focus{box-shadow:0 0 0 4px rgba(0,196,160,.2)}
  .nb-err{flex-basis:100%;text-align:center;font-size:12px;color:#d9534f}
  .nb-err:empty{display:none}
  .nickbar.ask{animation:askpulse 1.2s ease-in-out 3}
  @keyframes askpulse{50%{box-shadow:0 0 0 6px rgba(255,181,71,.45),0 10px 24px -12px rgba(15,42,51,.45)}}
  .nb-msg{flex-basis:100%;text-align:center;font-size:12.5px;color:#c27a00}
  /* 랭킹 */
  .rank{width:100%;max-width:720px;margin-top:40px;border-radius:24px;padding:22px 22px 16px;background:#fff;border:1px solid var(--line);box-shadow:0 10px 30px -18px rgba(15,42,51,.35);scroll-margin-top:80px}
  .rank header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .rank h3{margin:0;font-size:20px;font-weight:900;color:var(--navy)}
  .mode{font:800 10.5px var(--f-num);letter-spacing:.12em;padding:5px 10px;border-radius:99px;color:var(--mint-d);background:var(--mint-l);white-space:nowrap}
  .mode.local{color:#a86500;background:#fff3df}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;padding:4px;border-radius:14px;background:var(--mint-xl);border:1px solid var(--line)}
  .tab{flex:1 1 auto;min-width:0;font:800 12.5px var(--f-display);padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--gray);background:transparent;border:0;transition:color .2s,background .2s}
  .tab:hover{color:var(--navy)}
  .tab[aria-selected="true"]{color:#fff;background:var(--mint);box-shadow:0 4px 12px -6px rgba(0,151,124,.8)}
  .list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;min-height:120px}
  .list li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 14px;border-radius:12px;background:var(--mint-xl);animation:rowin .35s ease both;animation-delay:calc(var(--k,0)*.025s)}
  @keyframes rowin{from{opacity:0;transform:translateX(-8px)}}
  .list .pos{font:900 15px var(--f-num);color:var(--gray);text-align:center}
  .list .medal{font-size:20px;line-height:1}
  .list .nm{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--navy)}
  .list .sc{font:800 15px var(--f-num);font-variant-numeric:tabular-nums;color:var(--mint-d)!important}
  .list li.top1{background:#fff6e5}
  .list li.me{background:var(--mint-l);box-shadow:inset 0 0 0 1.5px var(--mint)}
  .list li.me .nm::after{content:" (나)";color:var(--mint-d);font-size:12px}
  .list li.flash{animation:rowin .35s ease both,mefl 1s ease 2}
  @keyframes mefl{50%{box-shadow:inset 0 0 0 2px var(--mint),0 0 0 6px rgba(0,196,160,.2)}}
  .list .empty{display:block;text-align:center;color:var(--gray);font-size:13.5px;padding:26px 8px;background:none}
  .note{margin:10px 2px 0;font-size:12px;color:var(--gray);line-height:1.5}
  .note:empty{display:none}
  .note.warn{color:#b0562a}
  .spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--mint);vertical-align:-2px;margin-right:8px;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* 게임 오버레이 */
  #game{position:fixed;inset:0;z-index:20;background:#03181a}
  #game iframe{display:block;width:100%;height:100%;border:0}
  /* 토스트 */
  #toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));z-index:30;pointer-events:none;transform:translate(-50%,-30px) scale(.8);opacity:0;
    padding:12px 22px;border-radius:16px;text-align:center;color:#fff;font-weight:900;letter-spacing:.02em;max-width:calc(100vw - 32px);background:var(--mint-d);box-shadow:0 16px 30px -12px rgba(0,151,124,.7)}
  #toast.show{animation:toast 2.6s cubic-bezier(.2,1.4,.4,1) forwards}
  #toast b{display:block;font-size:22px;line-height:1.1}
  #toast span{font:800 13px var(--f-num)}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,-30px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.06)}20%,85%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-20px) scale(.95)}}
  @media (max-width:520px){
    .topinfo{display:none}
    .hero{padding:32px 16px 26px;border-radius:22px}
    .nickbar{border-radius:20px;padding:10px 12px}
    .rank{padding:16px 12px 12px;border-radius:20px}
    .tab{font-size:11.5px;padding:8px 6px;flex-basis:calc(50% - 3px)}
    .list li{grid-template-columns:34px minmax(0,1fr) auto;gap:8px;padding:8px 10px}
  }
  .card.launch{z-index:4;transition:transform .5s cubic-bezier(.6,-0.2,.7,1),opacity .5s;transform:scale(1.4)!important;opacity:0}
  @media (prefers-reduced-motion:reduce){h1 span,.card,.list li{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<header class="topbar"><a class="logo" id="logo" href="#top" aria-label="홈"></a><span class="topinfo">미니게임 <b>4</b>종 · 실시간 랭킹</span></header>
<main id="top">
  <section class="hero">
  <span class="eyebrow">MINI GAME ARCADE</span>
  <h1 id="title"></h1>
  <div class="sub">닉네임을 정하고 게임을 골라 최고 기록에 도전하세요</div>
  <div class="nickbar" id="nickbar">
    <div class="nickform" id="nickView">
      <span class="nb-label">PLAYER</span>
      <span class="nb-nick empty" id="nickShow">닉네임 없음</span>
      <button class="btn" id="nickEdit" type="button">✎ 닉네임</button>
      <button class="btn hot" id="rankBtn" type="button">🏆 랭킹</button>
    </div>
    <form class="nickform" id="nickForm" hidden autocomplete="off">
      <span class="nb-label">NICKNAME</span>
      <input id="nickInput" maxlength="24" placeholder="닉네임 (2–12자)" aria-label="닉네임" spellcheck="false">
      <button class="btn hot" type="submit">저장</button>
      <button class="btn" type="button" id="nickCancel">취소</button>
      <span class="nb-err" id="nickErr" role="alert"></span>
    </form>
  </div>
  </section>
  <div class="cards" id="cards"></div>
  <div class="hint"><kbd>←</kbd><kbd>→</kbd> 선택 · <kbd>Enter</kbd> 시작 · <kbd>1</kbd>–<kbd>4</kbd> 바로 시작 · 게임 중 <kbd>Esc</kbd> 로 메뉴 복귀</div>
  <section class="rank" id="rank" aria-labelledby="rankTitle">
    <header><h3 id="rankTitle">🏆 랭킹</h3><span class="mode local" id="rankMode">로컬 기록</span></header>
    <div class="tabs" id="rankTabs" role="tablist"></div>
    <ol class="list" id="rankList"></ol>
    <p class="note" id="rankNote"></p>
  </section>
</main>
<div id="game" hidden><iframe id="gameFrame" name="arcade-game" title="게임" allow="autoplay; fullscreen"></iframe></div>
<div id="flash"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
// 게임이 예전 방식으로 index.html 로 되돌아와 오버레이 iframe 안에 런처가 뜬 경우: 부모에게 메뉴 복귀를 알리고 아무것도 그리지 않음
const EMBEDDED = window.name === 'arcade-game' && window.parent !== window;
if (EMBEDDED) { document.documentElement.style.visibility = 'hidden'; try { window.parent.postMessage({ type: 'menu' }, '*'); } catch (e) { } }
const GAMES = [
  { id: 'sky', href: 'skyblaze.html', name: 'SKY BLAZE', tag: 'SHOOTER', c1: '#2bd9ff', c2: '#ff6f61', key: 'skyblaze_hi',
    desc: '통통한 민트 비행기를 타고 하늘을 날며 심술쟁이 적들과 마감 몬스터를 물리쳐요!' },
  { id: 'brk', href: 'breaker.html', name: 'PRO BREAKER', tag: 'ARCADE', c1: '#19e3c0', c2: '#0e9f9a', key: 'neonbreaker_hi',
    desc: '공을 튕겨 알록달록 블록을 깨요. 폭탄 블록 연쇄 폭발, 멀티볼, 레이저까지!' },
  { id: 'run', href: 'runner.html', name: 'OFFICE DASH', tag: 'RUNNER', c1: '#ffd23f', c2: '#19e3c0', key: 'neondash_hi',
    desc: '지각은 안 돼요! 귀여운 직장인이 되어 출근길을 질주하세요. 현금을 모으고 비둘기는 밟아서 퇴치!' },
  { id: 'stk', href: 'stack.html', name: 'PRO STACK', tag: 'PUZZLE', c1: '#3bff9d', c2: '#2bd9ff', key: 'neonstack_hi',
    desc: '떨어지는 블록을 차곡차곡 쌓아 줄을 지워요. 4줄 클리어와 NOVA 블래스트!' },
];
const RANKED = GAMES.filter(g => !g.unranked);
const TAU = Math.PI * 2, rand = (a, b) => a + Math.random() * (b - a);

// ---------- 타이틀 글자 ----------
const BRAND = 'iM PRO ARCADE';
const title = document.getElementById('title');
{
  const words = BRAND.split(' ');
  const mark = words[0] === 'iM' ? words.shift() : null;
  let k = 0;
  if (mark) { const m = document.createElement('span'); m.className = 'm'; m.textContent = mark; m.style.animationDelay = '0s'; title.appendChild(m); k++; }
  words.forEach((w, i) => {
    if (i || mark) { const sp = document.createElement('span'); sp.className = 'sp'; sp.innerHTML = '&nbsp;'; title.appendChild(sp); }
    const s = document.createElement('span'); s.textContent = w; s.style.animationDelay = `${k++ * .08}s`; title.appendChild(s);
  });
  const logo = document.getElementById('logo');
  const lm = document.createElement('span'); lm.className = 'logo-mark'; lm.textContent = mark || '▶';
  const lt = document.createElement('span'); lt.textContent = words.join(' ');
  logo.append(lm, lt);
}

// ---------- 카드 ----------
const wrap = document.getElementById('cards');
let sel = -1, launching = false;
const previews = [];
GAMES.forEach((g, i) => {
  const el = document.createElement('div');
  el.className = 'card'; el.tabIndex = 0;
  el.style.setProperty('--i', i); el.style.setProperty('--c1', g.c1); el.style.setProperty('--c2', g.c2);
  const bestHTML = g.unranked ? `<span class="best free">FREE PLAY ♡</span>` : `<span class="best">BEST <b>0</b></span>`;
  el.innerHTML = `<div class="in"><canvas></canvas><div class="info">
      <span class="tag">${g.tag}</span><h2>${g.name}</h2><p>${g.desc}</p>
      <div class="row">${bestHTML}<button class="play" tabindex="-1">PLAY ▶</button></div>
    </div><div class="shine"></div></div>`;
  el.addEventListener('mouseenter', () => select(i));
  el.addEventListener('focus', () => select(i));
  el.addEventListener('mousemove', e => {
    const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    if (!el.classList.contains('launch')) el.style.transform = `rotateY(${(x - .5) * 16}deg) rotateX(${(.5 - y) * 12}deg) translateZ(20px) scale(1.03)`;
    el.style.setProperty('--mx', x * 100 + '%'); el.style.setProperty('--my', y * 100 + '%');
  });
  el.addEventListener('mouseleave', () => { el.style.transform = ''; });
  el.addEventListener('click', () => launch(i));
  wrap.appendChild(el);
  const cv = el.querySelector('canvas');
  previews.push({ el, cv, ctx: cv.getContext('2d'), game: g, st: null });
});
function select(i) {
  sel = i; wrap.classList.add('has-sel');
  previews.forEach((p, k) => p.el.classList.toggle('sel', k === i));
  blip(500 + i * 120);
}
// ---------- 게임 오버레이 ----------
const gameBox = document.getElementById('game'), gameFrame = document.getElementById('gameFrame'), flashEl = document.getElementById('flash');
let gameOpen = null, launchTimer = 0; // gameOpen: 실행 중인 GAMES 항목
function launch(i) {
  if (launching || gameOpen) return;
  if (!getNick()) { askNick(i); return; }
  launching = true;
  select(i);
  const p = previews[i];
  p.el.classList.add('launch');
  flashEl.getAnimations().forEach(a => a.cancel());
  flashEl.animate([{ opacity: 0 }, { opacity: .95 }, { opacity: 1 }], { duration: 520, easing: 'ease-in', fill: 'forwards' });
  warp = 6; whoosh();
  gameFrame.src = p.game.href; // 플래시 동안 미리 로드
  launchTimer = setTimeout(() => {
    gameOpen = p.game; lastGame = p.game.id;
    gameBox.hidden = false;
    document.body.style.overflow = 'hidden';
    try { gameFrame.focus(); gameFrame.contentWindow.focus(); } catch (e) { }
    flashEl.getAnimations().forEach(a => a.cancel());
    flashEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 380, easing: 'ease-out', fill: 'forwards' });
  }, 520);
}
gameFrame.addEventListener('load', () => { if (gameOpen) try { gameFrame.contentWindow.focus(); } catch (e) { } });
function closeGame() {
  if (!gameOpen && !launching) return;
  clearTimeout(launchTimer);
  const was = gameOpen; gameOpen = null; launching = false;

  c.fillStyle = '#ffd98a'; c.beginPath(); c.arc(rx0, ry, 4.5, 0, TAU); c.arc(rx1, ry, 4.5, 0, TAU); c.fill();
  // 드레스 4벌
  const DR = [['#ff8fd8', '#ffd1f0'], ['#b69cff', '#e4dbff'], ['#7fe8d0', '#d4fff4'], ['#ffb38a', '#ffe3d1']];
  const n = DR.length, sc = Math.min(1.25, h / 150);
  for (let i = 0; i < n; i++) {
    const hx = rx0 + (rx1 - rx0) * (i + .5) / n, ang = Math.sin(T * 1.7 + i * 1.3) * .13;
    const [col, lt] = DR[i];
    c.save(); c.translate(hx, ry); c.rotate(ang); c.scale(sc, sc);
    // 옷걸이
    c.strokeStyle = '#e9e2ff'; c.lineWidth = 1.6;
    c.beginPath(); c.arc(0, -3, 3.5, Math.PI, TAU * .9); c.moveTo(0, 0); c.lineTo(-15, 9); c.lineTo(15, 9); c.closePath(); c.stroke();
    // 끈 + 상의
    c.fillStyle = col;
    c.beginPath(); c.moveTo(-9, 9); c.lineTo(9, 9); c.lineTo(7, 28); c.lineTo(-7, 28); c.closePath(); c.fill();
    c.fillStyle = lt; c.fillRect(-7, 26, 14, 3); // 허리 리본띠
    // 치마 (살랑이는 스캘럽)
    const flare = 22 + Math.sin(T * 3 + i) * 1.5, sh = 34;
    const sg = c.createLinearGradient(0, 28, 0, 28 + sh); sg.addColorStop(0, col); sg.addColorStop(1, lt);
    c.fillStyle = sg;
    c.beginPath(); c.moveTo(-7, 29); c.lineTo(7, 29); c.lineTo(flare, 28 + sh);
    for (let k = 4; k >= 0; k--) { const x = -flare + k * flare * 2 / 5; c.quadraticCurveTo(x + flare / 5, 28 + sh + 6 + Math.sin(T * 4 + k + i) * 1.2, x, 28 + sh); }
    c.closePath(); c.fill();
    // 반짝 하이라이트 / 리본
    c.fillStyle = 'rgba(255,255,255,.45)'; c.beginPath(); c.ellipse(-4, 14, 2, 4, -.3, 0, TAU); c.fill();
    c.fillStyle = lt; c.beginPath(); c.moveTo(0, 27.5); c.lineTo(-5, 24); c.lineTo(-5, 31); c.closePath(); c.moveTo(0, 27.5); c.lineTo(5, 24); c.lineTo(5, 31); c.closePath(); c.fill();
    c.restore();
  }
  // 반짝이
  c.globalCompositeOperation = 'lighter';
  for (const s of st.sp) {
    s.t += dt; if (s.t > 2) { s.t = 0; s.x = Math.random() * w; s.y = Math.random() * h * .85; }
    const a = Math.sin(s.t / 2 * Math.PI);
    sparkle(c, s.x, s.y, s.s * a, '#fff4fd', a * .9);
    glowDot(c, s.x, s.y, s.s * 2.2, '#ff8fd8', a * .4);
  }
  c.globalCompositeOperation = 'source-over';
  // 통통 튀는 코인
  const cx = w * .86, bounce = Math.abs(Math.sin(T * 3.2)), cy = fy - 10 - bounce * h * .22;
  const sx = Math.cos(T * 6), squash = bounce < .08 ? 1.25 : 1;
  if (bounce < .04 && (st.coinT -= dt) <= 0) { st.coinT = .3; for (let i = 0; i < 5; i++) st.parts.push({ x: cx, y: fy, vx: rand(-70, 70), vy: rand(-90, -20), life: .35, col: '#ffe27a' }); }
  c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(cx, fy + 2, 9 * (1 - bounce * .5), 2.5, 0, 0, TAU); c.fill();
  c.globalCompositeOperation = 'lighter'; glowDot(c, cx, cy, 20, '#ffd23f', .55); c.globalCompositeOperation = 'source-over';
  c.save(); c.translate(cx, cy); c.scale(Math.max(.12, Math.abs(sx)) * squash, 1 / squash);
  c.fillStyle = '#e8a91e'; c.beginPath(); c.arc(0, 0, 9, 0, TAU); c.fill();
  c.fillStyle = '#ffd23f'; c.beginPath(); c.arc(0, 0, 7.2, 0, TAU); c.fill();
  c.fillStyle = sx > 0 ? '#fff3b8' : '#e8a91e'; c.font = '900 9px "Segoe UI",sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('♥', 0, .5);
  c.restore();
  stepParts(c, st, dt);
}
const DRAW = { sky: drawSkyPreview, brk: drawBreakerPreview, run: drawRunnerPreview, stk: drawStackPreview, dress: drawDressPreview };

let last = performance.now();
function frame(now) {
  if (EMBEDDED) return;
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  if (gameOpen) return; // 게임 중에는 런처 렌더링 정지
  drawBG(dt);
  for (const p of previews) { sizePreview(p); if (p.w > 1) DRAW[p.game.id](p, dt); }
}
requestAnimationFrame(frame);
</script>
